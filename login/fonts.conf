<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Kūhaku login: the name font has a single light weight; never embolden it. -->
  <match target="pattern">
    <test name="family"><string>Kuhaku Name</string></test>
    <edit name="weight" mode="assign"><const>regular</const></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Kuhaku Text</string></test>
    <edit name="weight" mode="assign"><const>regular</const></edit>
  </match>
</fontconfig>

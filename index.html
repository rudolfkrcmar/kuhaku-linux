<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kūhaku</title>
<style>
  :root { --bg:#f7f4f1; --fg:#111111; --muted:#666666; --faint:rgba(17,17,17,.08); --accent:#e0301e; }
  body.night { --bg:#121212; --fg:#ececec; --muted:#9a9a9a; --faint:rgba(236,236,236,.08); --accent:#f0705a; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; }
  body { background:var(--bg); color:var(--fg); font-family:'Inter Variable','Inter',system-ui,sans-serif;
         overflow:hidden; transition:background .6s, color .6s; -webkit-font-smoothing:antialiased;
         user-select:none; cursor:default; }

  /* The status row is the bar's row; on the home screen there is no minimise or close, so it ends at the edge. */
  .status { position:fixed; right:36px; top:0; height:34px; display:flex; align-items:center; gap:18px;
            font-size:12.7px; font-weight:300; letter-spacing:.02em; color:var(--muted); }
  .status .time { color:var(--fg); font-weight:400; font-variant-numeric:tabular-nums; }
  /* The Claude account in use: shown only when there is more than one; a click switches. */
  .stat.acct { display:flex; align-items:center; gap:8px; }
  .stat.acct.flip #acctName { animation:rise .35s cubic-bezier(.2,.7,.2,1) both; }
  .aigrid { display:grid; grid-template-columns:160px repeat(3, 1fr) auto; column-gap:36px; align-items:center; row-gap:18px; padding:14px 0; font-size:15px; font-weight:300; }
  .aigrid .k { color:var(--muted); }
  .aigrid .aihead { font-size:13px; opacity:.5; }
  .aigrid .aiok { display:inline-flex; align-items:center; gap:8px; }
  .aigrid .aiok::before { content:''; width:5px; height:5px; border-radius:9px; background:var(--accent); }
  .aigrid .aiwait { opacity:.55; }
  .aigrid .aidel { opacity:.45; }
  .acctadd { display:flex; gap:12px; align-items:stretch; margin-top:10px; }
  .acctadd .line { height:auto; }
  .acctadd input { border:0; outline:none; background:none; font:inherit; font-size:14px; font-weight:300; color:var(--fg); caret-color:var(--accent); width:220px; }
  .status .icons { display:flex; align-items:center; gap:18px; }
  .status .off { opacity:.35; }
  /* Connections mark: lines light up with Wi-Fi strength; the stem turns red while a Bluetooth device is connected. */
  #wifi path { transition:opacity .3s, stroke .3s; }
  #wifi path.dim { opacity:.25; }
  #wifi .stem { stroke:none; }
  #wifi.bt .stem { stroke:var(--accent); }
  .status { z-index:4; }
  .day.ev b::before { content:''; position:absolute; top:4px; left:50%; width:10px; height:1.5px; margin-left:-5px; background:var(--accent); }
  .day b { position:relative; }
  .evs { list-style:none; margin:16px 0 0; padding:0; display:flex; flex-direction:column; gap:12px; }
  .evs li { display:grid; grid-template-columns:62px 1fr; gap:12px; font-size:14px; font-weight:300; }
  .evs .t { color:var(--muted); font-variant-numeric:tabular-nums; padding-top:1px; }
  .evs b { font-weight:400; display:block; }
  .evs small { display:block; color:var(--muted); font-size:12px; margin-top:2px; }
  .evnone { margin-top:14px !important; }
  .calform { margin-top:10px; }
  .calform .pw { display:flex; gap:12px; align-items:stretch; margin:14px 0 6px; }
  .calform input { flex:1; border:0; outline:none; background:transparent; font:inherit; font-size:14px; font-weight:300; color:var(--fg); caret-color:var(--accent); }
  /* Light switch: three marks on one hairline; a red line slides under the chosen one. */
  .light .p-title { margin:0 0 30px; font-size:11px; font-weight:400; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }
  .lsw { position:relative; display:grid; grid-template-columns:repeat(3,1fr); padding-bottom:22px; }
  .lopt { border:0; background:none; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:14px; padding:6px 0 10px;
          color:var(--muted); font:inherit; font-size:14px; font-weight:300; letter-spacing:.02em; transition:color .3s; outline:none; }
  .lopt svg .hot { stroke:currentColor; transition:stroke .35s; }
  .lopt:hover { color:var(--fg); }
  .lopt.on { color:var(--fg); }
  .lopt.on svg .hot { stroke:var(--accent); }
  .ltrack { position:absolute; left:0; right:0; bottom:10px; height:1px; background:var(--faint); }
  .lmark { position:absolute; bottom:9px; height:2px; width:calc(100% / 3 * .5); background:var(--accent);
           left:calc(100% / 3 * var(--i) + 100% / 3 * .25); transition:left .45s cubic-bezier(.2,.7,.2,1); }
  .lnote { margin-top:20px !important; text-align:center; }
  /* Quick start, top left: the apps you open most, as quiet as the status bar. */
  /* The shortcuts belong with the corner marks below (same 44 px margin and box), not with the status row. */
  .quick { position:fixed; left:44px; top:36px; height:44px; display:flex; align-items:center; gap:8px; z-index:4; }
  .quick button { border:0; background:none; padding:0; cursor:pointer; display:grid; place-items:center;
                  width:44px; height:44px; border-radius:0;
                  font:inherit; font-size:13px; font-weight:300; letter-spacing:.02em; color:var(--muted);
                  transition:color .2s; outline:none; }
  .quick button:hover { color:var(--fg); background:var(--faint); }
  .quick svg { flex-shrink:0; transition:color .2s; }
  .quick button { position:relative; }
  /* Each mark is black; its one hot line turns red while the app is open. */
  .quick svg .hot { stroke:currentColor; transition:stroke .3s; }
  .quick button.on svg .hot { stroke:var(--accent); }
  .quick button.running.on::after { content:none; }
  .quick .sep { width:1px; height:18px; background:var(--faint); margin:0 4px; }
  .quick img { width:20px; height:20px; opacity:.7; filter:grayscale(1); transition:opacity .2s, filter .2s; }
  .quick button:hover img { opacity:1; filter:none; }
  .quick .letter { font-size:13px; font-weight:400; }
  body.paged .quick { opacity:0; pointer-events:none; }
  .stat { border:0; background:none; padding:6px 4px; margin:-6px -4px; font:inherit; color:inherit; letter-spacing:inherit;
          cursor:pointer; outline:none; display:flex; align-items:center; gap:28px; transition:color .2s; }
  .stat:hover, .stat.open { color:var(--fg); }
  .stat.open .time, .stat:hover .time { color:var(--fg); }
  .stat.open::after { content:''; position:absolute; }
  .icons .stat { padding:6px; margin:-6px; }

  .rec { color:var(--fg); gap:10px; }
  .rdot { width:7px; height:7px; border-radius:9px; background:var(--accent); }
  body.dim .stage, body.dim .menu { opacity:.08; filter:blur(3px); pointer-events:none; }
  .pscrim { position:fixed; inset:0; z-index:3; }
  .panel { position:fixed; top:108px; right:56px; width:376px; max-height:calc(100vh - 150px); overflow-y:auto; z-index:4;
           scrollbar-width:none; animation:drop .4s cubic-bezier(.2,.7,.2,1) both; user-select:none; }
  .panel::-webkit-scrollbar { display:none; }
  .p-head { display:flex; align-items:baseline; justify-content:space-between; gap:16px; }
  .p-title { margin:0; font-size:30px; font-weight:200; letter-spacing:-.02em; }
  .p-sub { margin:6px 0 0; font-size:13px; font-weight:300; color:var(--muted); letter-spacing:.01em; }
  .p-label { display:flex; justify-content:space-between; align-items:baseline; margin:34px 0 10px;
             font-size:11px; font-weight:400; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }
  .p-link { font-size:13px; font-weight:300; letter-spacing:.01em; text-transform:none; color:var(--muted); cursor:pointer;
            transition:color .15s; background:none; border:0; padding:0; font-family:inherit; }
  .p-link:hover { color:var(--fg); }
  .p-foot { margin-top:34px; display:flex; justify-content:space-between; }
  .p-rows { display:flex; flex-direction:column; }
  .p-row { display:flex; justify-content:space-between; gap:24px; padding:9px 0; font-size:14px; font-weight:300;
           border-top:1px solid var(--faint); }
  .p-row:first-child { border-top:0; }
  .p-row .k { color:var(--muted); }
  .p-row .v { text-align:right; font-variant-numeric:tabular-nums; }
  .p-row .v small { color:var(--muted); font-size:12px; margin-left:6px; }
  .p-wait { display:flex; align-items:center; gap:12px; font-size:14px; font-weight:300; color:var(--muted); padding:10px 0; }
  .p-wait .dot { margin:0; }

  .switch { width:32px; height:18px; border-radius:99px; border:1px solid var(--muted); position:relative; cursor:pointer;
            background:none; padding:0; flex-shrink:0; transition:border-color .25s; align-self:center; }
  .switch::after { content:''; position:absolute; top:3px; left:3px; width:10px; height:10px; border-radius:99px;
                   background:var(--muted); transition:left .25s cubic-bezier(.2,.7,.2,1), background .25s; }
  .switch.on { border-color:var(--accent); }
  .switch.on::after { left:17px; background:var(--accent); }

  /* Wi-Fi */
  .current { display:flex; gap:14px; align-items:flex-start; margin-top:26px; }
  .current .cdot { width:7px; height:7px; border-radius:9px; background:var(--accent); margin-top:9px; flex-shrink:0; }
  .current .name { font-size:19px; font-weight:300; letter-spacing:-.01em; overflow-wrap:anywhere; }
  .current .p-sub { margin-top:4px; }
  .current .p-link { margin-left:auto; margin-top:5px; opacity:0; transition:opacity .2s, color .15s; }
  .current:hover .p-link { opacity:1; }
  .nets { list-style:none; margin:0; padding:0; }
  .net { padding:10px 0; cursor:pointer; border-top:1px solid var(--faint); }
  .net:first-child { border-top:0; }
  .net .top { display:flex; align-items:center; gap:12px; font-size:15px; font-weight:300; transition:color .15s; }
  .net .top .n { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .net:hover .top { color:var(--fg); }
  .net .top svg { color:var(--muted); flex-shrink:0; }
  .net .note { font-size:12px; color:var(--muted); margin-top:4px; font-weight:300; }
  .net .note.err { color:var(--accent); }
  .pw { display:flex; align-items:stretch; gap:12px; margin:12px 0 4px; }
  .pw .line { height:auto; margin:2px 0; }
  .netacts { display:flex; gap:18px; margin:8px 0 4px 22px; }
  .p-link.inline { font-size:inherit; padding:0; }
  .pw input { flex:1; min-width:0; border:0; outline:none; background:transparent; padding:0; font:inherit; font-size:18px;
              font-weight:200; color:var(--fg); caret-color:var(--accent); }
  .pw input::placeholder { color:currentColor; opacity:.45; }

  /* Battery */
  .big { font-size:72px; font-weight:200; letter-spacing:-.04em; line-height:1; font-variant-numeric:tabular-nums; }
  .big span { font-size:28px; color:var(--muted); letter-spacing:0; margin-left:4px; }
  .meter { height:2px; background:var(--faint); margin:26px 0 0; border-radius:2px; overflow:hidden; }
  .meter i { display:block; height:100%; background:var(--accent); border-radius:2px; transition:width .6s; }
  .chart { display:block; width:100%; height:96px; overflow:visible; }
  .axis { display:flex; justify-content:space-between; font-size:11px; color:var(--muted); margin-top:8px; letter-spacing:.02em; }
  /* Choices: the chosen one in full colour with a small red dot before it, on the text's own line. */
  .opts { display:flex; gap:36px; }
  .opt { font-size:15px; font-weight:300; color:var(--muted); cursor:pointer; transition:color .15s; position:relative; line-height:24px; }
  .opt:hover, .opt.sel { color:var(--fg); }
  .opt.sel::before { content:''; position:absolute; left:-14px; top:50%; width:5px; height:5px; margin-top:-2.5px;
                     border-radius:9px; background:var(--accent); }

  /* Calendar */
  .cal-title { border:0; background:none; padding:0; font-family:inherit; color:inherit; cursor:pointer; text-align:left; }
  .cal-title .y { color:var(--muted); margin-left:8px; }
  .cal-nav { display:flex; gap:4px; align-items:center; }
  .cal-nav button { border:0; background:none; color:var(--muted); cursor:pointer; width:30px; height:30px; padding:0;
                    display:flex; align-items:center; justify-content:center; transition:color .15s; }
  .cal-nav button:hover { color:var(--fg); }
  .cal-nav .p-link { margin-right:10px; }
  .grid { display:grid; grid-template-columns:22px repeat(7, 1fr); row-gap:2px; margin-top:26px; }
  .grid .wd { font-size:11px; letter-spacing:.12em; color:var(--muted); text-align:center; padding-bottom:12px; }
  .grid .wk { font-size:10px; color:var(--muted); opacity:.55; display:flex; align-items:center; font-variant-numeric:tabular-nums; }
  .day { height:44px; display:flex; align-items:center; justify-content:center; cursor:pointer; position:relative;
         font-size:15px; font-weight:300; font-variant-numeric:tabular-nums; }
  .day b { width:36px; height:36px; border-radius:99px; display:flex; align-items:center; justify-content:center; font-weight:inherit;
           transition:background .2s, color .2s, box-shadow .2s; }
  .day:hover b { box-shadow:inset 0 0 0 1px var(--faint); background:var(--faint); }
  .day.we { color:var(--muted); }
  .day.out { opacity:.28; }
  .day.sel b { box-shadow:inset 0 0 0 1px var(--muted); background:none; }
  .day.today b { background:var(--accent); color:var(--bg); font-weight:400; box-shadow:none; }
  .cal-body.l { animation:slideL .35s cubic-bezier(.2,.7,.2,1) both; }
  .cal-body.r { animation:slideR .35s cubic-bezier(.2,.7,.2,1) both; }
  .cal-day { margin-top:26px; padding-top:20px; border-top:1px solid var(--faint); }
  .cal-day .d { font-size:19px; font-weight:300; letter-spacing:-.01em; }
  .years { display:grid; grid-template-columns:repeat(3, 1fr); gap:22px 18px; margin-top:26px; }
  .mini { cursor:pointer; border-radius:6px; transition:opacity .15s; }
  .mini .mn { font-size:12px; font-weight:400; margin-bottom:6px; letter-spacing:.02em; }
  .mini.now .mn { color:var(--accent); }
  .mini .mg { display:grid; grid-template-columns:repeat(7, 1fr); font-size:8.5px; line-height:13px; color:var(--muted);
              text-align:center; font-variant-numeric:tabular-nums; }
  .mini .mg i { font-style:normal; border-radius:9px; }
  .mini .mg i.t { background:var(--accent); color:var(--bg); }
  .years:hover .mini { opacity:.55; }
  .years .mini:hover { opacity:1; }

  .stage { position:fixed; inset:0; display:flex; justify-content:center; align-items:flex-start; padding:var(--top, 45vh) 24px 120px;
           transition:opacity .35s, filter .35s; }
  .column { width:min(1380px, 100%); max-height:100%; display:flex; flex-direction:column; gap:56px; }

  .row { display:flex; align-items:center; gap:16px; min-height:52px; flex-shrink:0; }
  .line { width:1.5px; height:30px; background:var(--accent); flex-shrink:0; }
  .dot { width:7px; height:7px; border-radius:999px; background:var(--accent); flex-shrink:0; margin-left:-3px; }
  #inputRow { align-items:stretch; min-height:0; padding:8px 0; }
  #inputRow .line { height:auto; margin:3px 0; position:relative; cursor:pointer; }
  /* The line is the way back to earlier messages: a wider hit area than its 1.5px. */
  #inputRow .line::before { content:""; position:absolute; inset:-6px -14px; }
  textarea { flex:1; border:0; outline:none; background:transparent; padding:0; margin:0; font:inherit; resize:none;
             font-size:26px; line-height:1.4; font-weight:200; letter-spacing:-.01em; color:var(--fg); caret-color:var(--accent);
             height:36px; max-height:40vh; overflow-y:auto; scrollbar-width:none; overflow-wrap:anywhere; }
  textarea::-webkit-scrollbar { display:none; }
  textarea::placeholder { color:currentColor; opacity:.5; }
  .asked-working { margin:0; font-size:26px; line-height:1.4; font-weight:200; letter-spacing:-.01em; opacity:.4;
                   overflow-wrap:anywhere; display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden; }
  #working { align-items:flex-start; }
  .dotHit { width:31px; height:36px; margin:0 -12px; padding:0; border:0; background:none; cursor:pointer; outline:none;
            display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  /* Working: the same red line as the input, breathing. */
  .dotHit .dot { margin:0; width:1.5px; height:30px; border-radius:0; }
  /* While Claude works: a quiet + to prepare the next message. It waits in the line when the answer comes. */
  /* Jobs: every conversation is a tab. A breathing dot works, a ring waits in line, a still red dot has
     an answer you have not seen. Shown once there is more than one, or while Claude works (to start another). */
  .jobtabs { display:flex; align-items:center; gap:14px; margin:-4px 0 -34px 0; flex-shrink:0; font-size:13.5px;
             font-weight:300; color:var(--muted); min-height:24px; flex-wrap:nowrap; min-width:0; }
  /* One line that scrolls sideways (wheel or swipe); the open tab is kept in view and + always stays visible. */
  .jobscroll { display:flex; align-items:center; gap:34px; min-width:0; overflow-x:auto; overflow-y:hidden;
               scrollbar-width:none; padding:4px 20px 4px 0; overscroll-behavior-x:contain; }
  .jobscroll::-webkit-scrollbar { display:none; }
  .jobscroll.more { -webkit-mask-image:linear-gradient(to right, #000 calc(100% - 48px), transparent);
                    mask-image:linear-gradient(to right, #000 calc(100% - 48px), transparent); }
  .jobscroll.less { -webkit-mask-image:linear-gradient(to right, transparent, #000 48px);
                    mask-image:linear-gradient(to right, transparent, #000 48px); }
  .jobscroll.more.less { -webkit-mask-image:linear-gradient(to right, transparent, #000 48px, #000 calc(100% - 48px), transparent);
                         mask-image:linear-gradient(to right, transparent, #000 48px, #000 calc(100% - 48px), transparent); }
  .jobtabs .jobplus { flex-shrink:0; }
  .jobtab { position:relative; flex-shrink:0; display:flex; align-items:center; gap:9px; cursor:pointer; transition:color .15s; max-width:260px; }
  .jobtab b { font-weight:inherit; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .jobtab:hover, .jobtab.on { color:var(--fg); }
  .jobtab i { width:5px; height:5px; border-radius:9px; flex-shrink:0; box-sizing:border-box; }
  .jobtab i.run { background:var(--accent); }
  .jobtab i.queued { border:1px solid var(--muted); }
  .jobtab i.unseen { background:var(--accent); }
  .jobtab i.idle { display:none; }
  .jobtab .x { position:absolute; right:-16px; border:0; background:none; padding:0; color:var(--muted); cursor:pointer; opacity:0; font:inherit; line-height:1; transition:opacity .15s; }
  .jobtab:hover .x { opacity:.8; }
  .jobtab.busy .x { opacity:.45; }
  .jobtab .x:hover { color:var(--fg); }
  .jobtab small { font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .jobplus { border:0; background:none; padding:0; width:22px; height:22px; display:grid; place-items:center; color:var(--muted);
             cursor:pointer; opacity:.7; transition:opacity .15s, color .15s; }
  .jobplus:hover { opacity:1; color:var(--fg); }
  /* A tab's name: click the open tab (or double-click any) to rename it. */
  .jobtab input.tabname { font:inherit; color:var(--fg); background:none; border:0; outline:none; padding:0 0 1px; margin:0;
                          border-bottom:1px solid var(--accent); min-width:40px; max-width:240px; }
  /* Who does this tab's job: a quiet word under the line, its choices underneath. */
  .agent { border:0; background:none; padding:0; margin:-46px 0 0 23px; font:inherit; font-size:13.5px; font-weight:300; color:var(--muted);
           cursor:pointer; align-self:flex-start; white-space:nowrap; flex-shrink:0; transition:color .15s; }
  .agent:hover { color:var(--fg); }
  .agentmenu { display:flex; flex-direction:column; gap:10px; margin:-42px 0 0 23px; font-size:14px; font-weight:300; color:var(--muted); }
  .agentmenu button { border:0; background:none; padding:0; font:inherit; color:inherit; cursor:pointer; transition:color .15s; text-align:left; }
  .agentmenu button small { font-size:12px; color:var(--muted); margin-left:14px; }
  .agentmenu button.anon { margin-top:6px; padding-top:12px; border-top:1px solid var(--faint); }
  .agentmenu button:hover, .agentmenu button.on { color:var(--fg); }
  .queuerow { margin:-40px 0 0 23px; display:flex; gap:24px; align-items:baseline; font-size:14px; font-weight:300; color:var(--muted); }
  .queuerow button { border:0; background:none; padding:0 0 2px; cursor:pointer; font:inherit; color:var(--muted); }
  .queuerow button:hover { color:var(--fg); }
  .queuerow button.on { color:var(--fg); border-bottom:1.5px solid var(--accent); }
  #working.waiting .dot { animation:none; background:none; box-shadow:inset 0 0 0 1.2px var(--muted); }
  .next { display:flex; align-items:flex-start; gap:16px; margin-bottom:-40px; flex-shrink:0; }
  .next .plus { width:31px; height:36px; margin:0 -12px; padding:0; border:0; background:none; cursor:pointer; outline:none;
                color:var(--muted); opacity:.45; display:flex; align-items:center; justify-content:center; flex-shrink:0;
                transition:opacity .2s; }
  .next .plus:hover, .next.on .plus { opacity:.9; }
  .next textarea { font-size:22px; color:var(--muted); height:31px; }
  .next textarea::placeholder { opacity:.6; }

  .activity { list-style:none; margin:-32px 0 0 23px; padding:0; display:flex; flex-direction:column; gap:10px;
              max-height:38vh; overflow-y:auto; scrollbar-width:none; animation:rise .35s cubic-bezier(.2,.7,.2,1) both;
              -webkit-mask-image:linear-gradient(to bottom, transparent 0, #000 28px); }
  .activity::-webkit-scrollbar { display:none; }
  .activity li { font-size:15px; line-height:1.5; font-weight:300; color:var(--muted); overflow-wrap:anywhere;
                 animation:rise .35s cubic-bezier(.2,.7,.2,1) both; }
  .activity li:first-child { margin-top:28px; }
  .activity li.thought { font-style:italic; }
  .stoprow { margin:-40px 0 0 23px; animation:rise .35s both; }
  /* Stop: a red square; the word appears only when pointed at. */
  .stoprow button { border:0; background:none; padding:4px 0; cursor:pointer; font:inherit; font-size:14px; font-weight:300;
                    color:var(--muted); display:flex; align-items:center; gap:12px; outline:none; }
  .stoprow button i { width:10px; height:10px; background:var(--accent); flex-shrink:0; transition:transform .2s; }
  .stoprow button span { opacity:0; transform:translateX(-4px); transition:opacity .2s, transform .2s; }
  .stoprow button:hover span { opacity:1; transform:none; color:var(--fg); }
  .stoprow button:hover i { transform:scale(1.15); }
  .tokens { margin:-38px 0 0 23px; font-size:12px; font-weight:300; color:var(--muted); letter-spacing:.02em;
            font-variant-numeric:tabular-nums; animation:rise .35s both; }
  .day i { position:absolute; bottom:3px; left:50%; width:3px; height:3px; margin-left:-1.5px; border-radius:9px;
           background:var(--accent); }
  .limit { margin:14px 0 0; }
  .limit .top { display:flex; justify-content:space-between; font-size:14px; font-weight:300; }
  .limit .top span:last-child { color:var(--muted); font-size:12px; }
  .limit .meter { margin-top:9px; }
  .activity li:last-child { color:var(--fg); }

  .mic { width:36px; height:36px; margin:0 -8px 0 4px; padding:0; border:0; background:none; cursor:pointer; outline:none;
         color:var(--muted); opacity:.55; transition:opacity .2s, color .2s; flex-shrink:0; align-self:flex-start;
         display:flex; align-items:center; justify-content:center; }
  .mic:hover { opacity:1; }
  .mic.rec { color:var(--accent); opacity:1; animation:pulse 1.4s ease-in-out infinite; }
  .mic.busy { color:var(--accent); opacity:.6; cursor:default; }
  .tools { display:flex; flex-direction:column; align-self:flex-start; margin:0 -8px 0 4px; flex-shrink:0; }
  .tools .mic { margin:0; }
  #inputRow .tools { flex-direction:row; flex-wrap:nowrap; gap:0; padding-top:0; }

  .answer { display:flex; flex-direction:column; gap:20px; min-height:0; animation:rise .6s cubic-bezier(.2,.7,.2,1) both; }
  .answer .nav { display:flex; align-items:center; gap:6px; margin:-8px 0 -6px -10px; color:var(--muted);
               opacity:.45; transition:opacity .25s; flex-shrink:0; }
  .answer:hover .nav, .answer .nav:focus-within { opacity:1; }
  .answer .nav button { border:0; background:none; color:inherit; width:30px; height:30px; padding:0; cursor:pointer; outline:none;
                        display:flex; align-items:center; justify-content:center; transition:color .15s; }
  .answer .nav button:hover { color:var(--fg); }
  .answer .nav button[disabled] { opacity:.25; pointer-events:none; }
  .answer .nav .pos { font-size:12px; letter-spacing:.04em; font-variant-numeric:tabular-nums; min-width:64px; text-align:center; }
  .answer .nav .when { font-size:12px; margin-left:8px; }
  .answer .nav .close { margin-left:auto; }
  .answer .q { margin:0; font-size:14px; line-height:1.5; font-weight:300; color:var(--muted); flex-shrink:0;
               white-space:pre-wrap; overflow-wrap:anywhere; display:-webkit-box; -webkit-line-clamp:3;
               -webkit-box-orient:vertical; overflow:hidden; }
  .answer .a { margin:0; font-size:30px; line-height:1.35; font-weight:300; letter-spacing:-.02em;
               white-space:pre-wrap; overflow-wrap:anywhere; overflow-y:auto; min-height:0; user-select:text; cursor:text;
               scrollbar-width:none; }
  .answer .a::-webkit-scrollbar { display:none; }
  .answer .a.medium { font-size:22px; line-height:1.5; letter-spacing:-.01em; }
  .answer .a.long { font-size:17px; line-height:1.65; letter-spacing:0; }
  .answer .a.error { color:var(--muted); }
  .answer .a a { color:inherit; text-decoration-color:var(--accent); text-underline-offset:3px; }

  /* The menu: one red line, the same line that sits above the name kūhaku. */
  .menu { position:fixed; left:44px; bottom:36px; width:44px; height:44px; border:0; background:none; padding:0; cursor:pointer;
          display:grid; place-items:center; outline:none; z-index:2; }
  .menu span { width:22px; height:2px; background:var(--accent); transition:width .25s cubic-bezier(.2,.7,.2,1), height .2s; }
  .menu:hover span { width:28px; }
  .menu.open span { width:28px; height:3px; }

  .sheet { position:fixed; left:28px; bottom:92px; display:flex; flex-direction:column; gap:12px; z-index:2; padding:36px 44px 24px;
           background:var(--bg); border-radius:18px; box-shadow:0 0 0 1px var(--faint), 0 24px 60px rgba(0,0,0,.18);
           animation:rise .35s cubic-bezier(.2,.7,.2,1) both; }
  .scrim { background:var(--bg); opacity:.78; }
  /* The menu is only icons: what each one is shows quietly underneath while pointing at it. */
  .sheet .srow3 { display:flex; gap:12px; }
  .sheet .srow3 + .srow3 { border-top:1px solid var(--faint); padding-top:12px; }
  .sheet button { width:96px; height:96px; border:0; background:none; padding:0; cursor:pointer; outline:none; border-radius:20px;
                  display:grid; place-items:center; color:var(--muted); transition:color .15s, background .15s; }
  .sheet button svg .hot { transition:stroke .15s; }
  .sheet button:hover, .sheet button:focus-visible { color:var(--fg); }
  .sheet button:hover svg .hot, .sheet button:focus-visible svg .hot { stroke:var(--accent); }
  .sheet .cap { height:32px; padding:10px 0 0 28px; font-size:24px; font-weight:300; letter-spacing:.02em; color:var(--muted); }
  .scrim { position:fixed; inset:0; z-index:1; }
  /* Open apps: a red dot at the end of the top row (the bar over apps has it before the red line). */
  .rundot { width:24px; height:34px; margin:0 -6px 0 -2px; border:0; background:none; padding:0;
            cursor:pointer; display:grid; place-items:center; outline:none; }
  .rundot[hidden] { display:none; }
  .rundot span { width:6px; height:6px; border-radius:99px; background:#e5484d; transition:transform .2s; }
  .rundot:hover span, .rundot.open span { transform:scale(1.3); }
  .runs { position:fixed; right:28px; top:46px; min-width:300px; z-index:2; padding:22px 18px 18px;
          background:var(--bg); border-radius:18px; box-shadow:0 0 0 1px var(--faint), 0 24px 60px rgba(0,0,0,.18);
          animation:rise .35s cubic-bezier(.2,.7,.2,1) both; }
  .runs h4 { margin:0 0 10px 14px; font-size:11px; font-weight:400; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }
  .runs .row { display:flex; align-items:center; gap:14px; padding:8px 8px 8px 14px; border-radius:10px; cursor:pointer;
               font-size:15px; font-weight:300; color:var(--fg); }
  .runs .row:hover { background:var(--faint); }
  .runs .row img, .runs .row .letter { width:20px; height:20px; flex-shrink:0; display:grid; place-items:center; font-size:12px; }
  .runs .row .name { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .runs .row .x { width:28px; height:28px; border:0; background:none; border-radius:99px; color:var(--muted); cursor:pointer;
                  display:grid; place-items:center; opacity:.6; }
  .runs .row .x:hover { opacity:1; color:#e5484d; background:var(--faint); }
  .runs .all { margin:10px 14px 0; font-size:13px; font-weight:300; color:var(--muted); cursor:pointer; border:0; background:none; padding:0; }
  .runs .all:hover { color:#e5484d; }
  /* Bottom row: menu line, Miru. */
  .filesmark { position:fixed; left:96px; bottom:36px; width:44px; height:44px; border:0; background:none; padding:0; cursor:pointer;
               display:grid; place-items:center; z-index:2; outline:none; color:var(--muted); transition:color .2s, left .25s; }
  .filesmark:hover { color:var(--fg); }
  .filesmark svg .hot { stroke:currentColor; transition:stroke .3s; }
  .filesmark.on svg .hot { stroke:var(--accent); }
  .menu { transition:left .25s; }
  body.dim .filesmark { opacity:.08; filter:blur(3px); pointer-events:none; }

  .hint { position:fixed; left:50%; bottom:44px; transform:translateX(-50%); font-size:12px; font-weight:300;
          color:var(--muted); opacity:0; transition:opacity .4s; letter-spacing:.02em; }
  .hint.show { opacity:.7; }

  [hidden] { display:none !important; }
  @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:.15 } }
  /* Pages: Apps and Settings, full screen, same quiet type */
  body.paged .stage, body.paged .hint { opacity:0; pointer-events:none; }
  .page { position:fixed; inset:0; z-index:3; overflow-y:auto; scrollbar-width:none; background:var(--bg);
          padding:132px 24px 140px; animation:rise .45s cubic-bezier(.2,.7,.2,1) both;
          -webkit-mask-image:linear-gradient(to bottom, transparent 0, transparent 70px, #000 120px); }
  .page::-webkit-scrollbar { display:none; }
  /* On a page the status row is the bar over apps exactly: date, time, Wi‑Fi, battery, the red line, the cross. */
  .pageclose { position:fixed; right:20px; top:0; width:40px; height:34px; border:0; background:none; padding:0;
               cursor:pointer; color:var(--muted); z-index:5; display:grid; place-items:center;
               transition:color .2s; outline:none; }
  .pageclose:hover { color:var(--fg); }
  .pagehome { position:fixed; right:60px; top:0; width:44px; height:34px; border:0; background:none; padding:0; cursor:pointer; z-index:5; outline:none; }
  .pagehome i { position:absolute; right:6px; top:16px; width:20px; height:2px; background:var(--accent); transition:width .2s; }
  .pagehome:hover i { width:26px; }
  body.paged .status { right:124px; }
  .page .inner { width:min(1160px, 100%); margin:0 auto; }
  .page .inner.narrow { width:min(720px, 100%); }
  .page h1 { margin:0 0 8px; font-size:30px; font-weight:200; letter-spacing:-.02em; }
  .find { display:flex; align-items:stretch; gap:16px; padding:8px 0; margin-bottom:44px; }
  .find .line { height:auto; margin:3px 0; }
  .find input { flex:1; border:0; outline:none; background:transparent; padding:0; font:inherit; font-size:26px; line-height:1.4;
                font-weight:200; letter-spacing:-.01em; color:var(--fg); caret-color:var(--accent); }
  .find input::placeholder { color:currentColor; opacity:.5; }
  .applist { columns:4 220px; column-gap:48px; }
  .app { display:block; break-inside:avoid; padding:8px 0; font-size:17px; font-weight:300; letter-spacing:-.005em;
         color:var(--fg); opacity:.82; cursor:pointer; transition:opacity .15s; position:relative; }
  .app:hover, .app.first { opacity:1; }
  .app:hover::before, .app.first::before { content:''; position:absolute; left:-16px; top:50%; width:5px; height:5px;
         margin-top:-2.5px; border-radius:9px; background:var(--accent); }
  .app small { display:block; font-size:12px; color:var(--muted); margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .empty { font-size:15px; color:var(--muted); font-weight:300; }
  .srow { display:flex; align-items:center; gap:36px; min-height:32px; padding:14px 0; border-top:1px solid var(--faint); font-size:15px; font-weight:300; }
  .srow:first-child { border-top:0; }
  .srow .k { width:160px; flex-shrink:0; color:var(--muted); }
  .srow .val { width:44px; text-align:right; font-variant-numeric:tabular-nums; flex-shrink:0; }
  .srow .opts { flex-wrap:wrap; row-gap:14px; }
  .srow .grow { flex:1; min-width:0; }
  .slider { flex:1; height:26px; position:relative; cursor:pointer; touch-action:none; }
  .slider::before { content:''; position:absolute; left:0; right:0; top:12px; height:2px; background:var(--faint); border-radius:2px; }
  .slider i { position:absolute; left:0; top:12px; height:2px; background:var(--accent); border-radius:2px; }
  .slider b { position:absolute; top:8.5px; width:9px; height:9px; margin-left:-4.5px; border-radius:9px; background:var(--accent);
              transition:transform .15s; }
  .slider:hover b, .slider.drag b { transform:scale(1.35); }
  .tools { display:flex; flex-wrap:wrap; gap:12px 26px; padding-top:6px; }
  .tools span { font-size:14px; font-weight:300; color:var(--muted); cursor:pointer; transition:color .15s; }
  .tools span:hover { color:var(--fg); }

  @keyframes drop { from { opacity:0; transform:translateY(-8px) } to { opacity:1; transform:none } }
  @keyframes slideL { from { opacity:0; transform:translateX(18px) } to { opacity:1; transform:none } }
  @keyframes slideR { from { opacity:0; transform:translateX(-18px) } to { opacity:1; transform:none } }
  @keyframes rise { from { opacity:0; transform:translateY(6px) } to { opacity:1; transform:none } }
</style>
</head>
<body>

<div class="quick" id="quick">
  <button data-launch="com.anthropic.Claude.desktop" title="Claude" aria-label="Claude"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="1.4"><path d="M12 4v16M4 12h16M6.3 17.7L17.7 6.3" stroke="currentColor"/><path class="hot" d="M6.3 6.3l11.4 11.4"/></svg></button>
  <button data-launch="mado.desktop" title="Mado" aria-label="Mado"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="1.4"><path d="M7.2 9.2h9.6v9.6H7.2z" stroke="currentColor"/><path class="hot" d="M6.2 5.35h11.6"/></svg></button>
  <button data-launch="tegami.desktop" title="Tegami" aria-label="Tegami"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="1.4" stroke-linejoin="miter"><path d="M4.5 7.5L12 16.5L19.5 7.5" stroke="currentColor"/><path class="hot" d="M4.5 7.5h15"/></svg></button>
  <button data-launch="tsukuru.desktop" title="Tsukuru" aria-label="Tsukuru"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="1.4"><path d="M9 4v16" stroke="currentColor"/><path class="hot" d="M15 4v16"/></svg></button>
</div>
<div class="status">
  <button class="stat rec" id="recBtn" title="Stop recording (Cmd+Shift+5)" hidden><span class="rdot"></span>Recording</button>
  <button class="stat acct" id="acctBtn" title="Claude account: click to switch" hidden><span id="acctName"></span></button>
  <button class="stat" id="calBtn" title="Calendar"><span id="date"></span></button>
  <button class="stat" id="timeBtn" title="Day, night or auto"><span class="time" id="clock"></span></button>
  <span class="icons">
    <button class="stat" id="wifiBtn" title="Wi‑Fi and Bluetooth"><svg id="wifi" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="1.4" stroke-linecap="butt"><path class="l3" d="M4.5 6.5h15" stroke="currentColor"/><path class="l2" d="M7.5 11h9" stroke="currentColor"/><path class="l1" d="M10 15.5h4" stroke="currentColor"/><path class="stem" d="M12 15.5v5"/></svg></button>
    <button class="stat" id="batteryWrap" title="">
      <svg width="18" height="6" viewBox="0 0 18 6"><rect width="18" height="6" fill="currentColor" opacity=".18"/><rect id="batteryFill" width="12" height="6" fill="currentColor"/></svg>
    </button>
  </span>
  <button class="rundot" id="runDot" title="Open apps" aria-label="Open apps" hidden><span></span></button>
</div>

<main class="stage">
  <div class="column">
    <nav class="jobtabs" id="jobTabs" hidden></nav>
    <div class="next" id="next" hidden>
      <button class="plus" id="nextPlus" title="Prepare your next message"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
      <textarea id="nextText" rows="1" placeholder="Next message" spellcheck="false" hidden></textarea>
    </div>
    <div class="row" id="working" hidden>
      <button class="dotHit" id="dot" title="What Claude is doing"><span class="dot" role="status" aria-label="Claude is working"></span></button>
      <p class="asked-working" id="askedWorking"></p>
    </div>
    <ul class="activity" id="activity" hidden></ul>
    <p class="tokens" id="tokens" hidden></p>
    <div class="queuerow" id="queueRow" hidden><span id="queueNote"></span><button id="qFirst">Put first</button><button id="qNow" hidden>Start now</button><button id="qLeave">Take out of the line</button></div>
    <div class="stoprow" id="stopRow" hidden><button id="stopBtn" aria-label="Stop"><i></i><span>Stop</span></button></div>

    <div class="answer" id="answer" hidden>
      <div class="nav" id="answerNav">
        <button id="prevAnswer" title="Earlier answer (Alt+Left)"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
        <span class="pos" id="answerPos"></span>
        <button id="nextAnswer" title="Later answer (Alt+Right)"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
        <span class="when" id="answerWhen"></span>
        <button class="close" id="closeAnswer" title="Close (Esc)"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <p class="q" id="askedAnswer"></p>
      <p class="a" id="answerText"></p>
    </div>

    <label class="row" id="inputRow">
      <span class="line" aria-hidden="true"></span>
      <textarea id="ask" rows="1" placeholder="Ask Claude" autocomplete="off" spellcheck="false" autofocus></textarea>
      <span class="tools">
        <button class="mic" id="mic" title="Talk with Claude (Ctrl+Space)" aria-label="Talk with Claude"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0"/><path d="M12 17.5V21"/></svg></button>
        <button class="mic" id="pic" title="Add a picture for Claude" aria-label="Add a picture for Claude"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="14" rx="2.5"/><circle cx="9" cy="10" r="1.6"/><path d="M20.5 16l-5-5-8.5 8"/></svg></button>
      </span>
    </label>
    <button class="agent" id="agentBtn" title="Who does this job" hidden></button>
    <div class="agentmenu" id="agentMenu" hidden></div>
  </div>
</main>

<div class="hint" id="hint"></div>

<div class="scrim" id="scrim" hidden></div>
<div class="pscrim" id="pscrim" hidden></div>
<div class="page" id="page" hidden></div>
<button class="pagehome" id="pageHome" title="Home" aria-label="Home" hidden><i></i></button>
<button class="pageclose" id="pageClose" title="Close (Esc)" aria-label="Close" hidden><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
<div class="panel" id="panel" hidden></div>
<div class="sheet" id="sheet" hidden>
  <div class="srow3">
    <button data-id="apps" title="Apps" aria-label="Apps"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="7.5" r="2.2"/><circle cx="16.5" cy="7.5" r="2.2"/><circle cx="7.5" cy="16.5" r="2.2"/><circle class="hot" cx="16.5" cy="16.5" r="2.2"/></svg></button>
    <button data-id="terminal" title="Terminal" aria-label="Terminal"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 7.5l4.5 4.5-4.5 4.5"/><path class="hot" d="M12.5 17h6"/></svg></button>
    <button data-id="kansei" title="Kansei" aria-label="Kansei"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4.5"/><path class="hot" d="M7.5 12l2-5 3.5 10 2-5"/><path d="M15 12h6"/></svg></button>
    <button data-id="kiroku" title="Kiroku" aria-label="Kiroku"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><path d="M5 6.5h1.5M9.5 6.5H19"/><path d="M5 12h1.5M9.5 12H19"/><path class="hot" d="M5 17.5h1.5M9.5 17.5H15"/></svg></button>
  </div>
  <div class="srow3">
    <button data-id="sound" title="Sound" aria-label="Sound"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><path d="M6 10v4"/><path class="hot" d="M10 6.5v11"/><path d="M14 8.5v7"/><path d="M18 11v2"/></svg></button>
    <button data-id="network" title="Wi‑Fi" aria-label="Wi‑Fi"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 6.5h15"/><path d="M7.5 11h9"/><path class="hot" d="M10 15.5h4"/><path d="M12 15.5v4"/></svg></button>
    <button data-id="display" title="Display" aria-label="Display"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="11" rx="2"/><path class="hot" d="M9 19.5h6"/></svg></button>
    <button data-id="settings" title="Settings" aria-label="Settings"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h16"/><path d="M4 16h16"/><circle cx="9" cy="8" r="2.2" fill="var(--bg)"/><circle class="hot" cx="15" cy="16" r="2.2" fill="var(--bg)"/></svg></button>
  </div>
  <div class="srow3">
    <button data-id="lock" title="Lock" aria-label="Lock"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><rect x="5.5" y="10.5" width="13" height="9.5" rx="2"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/><path class="hot" d="M12 14v2.5"/></svg></button>
    <button data-id="logout" title="Log out" aria-label="Log out"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><path d="M10 4.5H6.5a1 1 0 0 0-1 1v13a1 1 0 0 0 1 1H10"/><path class="hot" d="M11 12h9"/><path class="hot" d="M17 9l3 3-3 3"/></svg></button>
    <button data-id="restart" title="Restart" aria-label="Restart"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><path d="M18.5 12a6.5 6.5 0 1 1-1.9-4.6"/><path class="hot" d="M17.5 3.5v4h-4"/></svg></button>
    <button data-id="shutdown" title="Shut down" aria-label="Shut down"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><path d="M7.6 7.4a6.5 6.5 0 1 0 8.8 0"/><path class="hot" d="M12 3.5v8"/></svg></button>
  </div>
  <div class="cap" id="sheetCap"></div>
</div>

<div class="runs" id="runs" hidden></div>
<button class="menu" id="menu" aria-label="Open menu" title="Menu"><span></span></button>
<button class="filesmark" id="filesMark" data-launch="miru.desktop" title="Miru 見る · files" aria-label="Miru"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="1.4"><path d="M4 9h16" stroke="currentColor"/><path class="hot" d="M4 15h16"/></svg></button>

<script>
  const $ = (id) => document.getElementById(id);
  // The pulsing dots breathe at 12 frames a second, not 60: every frame redraws the whole
  // screen, and a CSS animation kept the processor and X busy the whole time Claude worked.
  const pulseFrom = performance.now();
  setInterval(() => {
    const dots = document.querySelectorAll('.dot, .rdot, .jobtab i.run'); if (!dots.length) return;
    const o = (0.575 + 0.425 * Math.cos((performance.now() - pulseFrom) / 1400 * 2 * Math.PI)).toFixed(2);
    dots.forEach((d) => { if (d.offsetParent !== null && d.style.opacity !== o) d.style.opacity = o; });
  }, 83);
  const ask = $('ask');
  const native = (msg) => {
    try { window.webkit.messageHandlers.kuhaku.postMessage(JSON.stringify(msg)); }
    catch (e) { if (msg.type === 'ask') setTimeout(() => showAnswer({ question: msg.text, answer: 'Kūhaku is not connected to Claude here.' }), 1200); }
  };

  let pendingDraft = '', phase = 'home', hintTimer, history = [], historyAt = 0, showActivity = false, dictation = 'off', showWho = false;

  function grow() { ask.style.height = 'auto'; ask.style.height = ask.scrollHeight + 'px'; }
  function setAsk(v) { ask.value = v; grow(); if (typeof keepDraft === "function") keepDraft(); }
  ask.addEventListener('input', grow);

  // The pulsing line opens a quiet list of what Claude is doing, with a way to stop it.
  $('dot').addEventListener('click', () => {
    showActivity = !showActivity;
    $('activity').hidden = !showActivity || phase !== 'working';
    $('tokens').hidden = $('activity').hidden || !$('tokens').textContent;
    $('stopRow').hidden = $('activity').hidden;
  });
  $('stopBtn').addEventListener('click', () => { native({ type: 'cancel' }); show('home'); });
  const fmt = (n) => n < 1000 ? String(n) : n < 1e6 ? (n / 1e3).toFixed(n < 1e4 ? 1 : 0) + 'k' : (n / 1e6).toFixed(1) + 'M';
  let tok = null, limits = null;
  function drawTokens() {
    const parts = [];
    if (tok) parts.push(`${fmt(tok.context)} in context`, `${fmt(tok.written)} written`, `${tok.steps} ${tok.steps === 1 ? 'step' : 'steps'}`);
    if (limits?.session) parts.push(`session ${Math.round(limits.session.percent)}% used`);
    $('tokens').textContent = parts.join('  ·  ');
    $('tokens').hidden = !showActivity || phase !== 'working' || !parts.length;
  }
  window.setTokens = (t) => { if (t && t.tab && t.tab !== jobs.current) return; tok = t; drawTokens(); };
  window.setLimits = (l) => { if (l) limits = l; drawTokens(); };
  window.addActivity = ({ kind, text, tab }) => {
    if (phase !== 'working' || (tab && tab !== jobs.current)) return;
    const li = document.createElement('li');
    li.className = kind; li.textContent = text;
    $('activity').append(li);
    $('activity').scrollTop = $('activity').scrollHeight;
  };

  // Dictation: recorded and transcribed offline by Kūhaku, text lands in the line.
  function setMic(state) {
    dictation = state;
    $('mic').className = 'mic' + (state === 'rec' ? ' rec' : state === 'busy' ? ' busy' : '');
    ask.placeholder = state === 'rec' ? 'Listening…' : state === 'busy' ? 'Writing it down…' : 'Ask ' + askWho(curTab()?.agent);
  }
  function toggleDictation() {
    if (dictation === 'off') { setMic('rec'); native({ type: 'dictate', on: true }); }
    else if (dictation === 'rec') { setMic('busy'); native({ type: 'dictate', on: false }); }
  }
  // The mic now hands over to the Claude app, where you talk with Claude.
  // (Offline dictation above stays available: swap talk() for toggleDictation().)
  function talk() { native({ type: 'panel', action: 'talk' }); }
  $('mic').addEventListener('click', talk);
  // Pictures for Claude: picked files are copied into ~/Pictures/ForClaude and named in the line.
  $('pic').addEventListener('click', (e) => { e.preventDefault(); native({ type: 'picture' }); });
  window.picturesAdded = ({ files, error }) => {
    if (error) { ask.placeholder = error; setTimeout(() => setMic(dictation), 3000); return; }
    if (!files || !files.length) { focusInput(); return; }
    const note = (files.length > 1 ? 'Pictures: ' : 'Picture: ') + files.join(', ');
    setAsk((ask.value.trim() ? ask.value.replace(/\s*$/, '\n') : '') + note + '\n');
    focusInput();
    ask.setSelectionRange(ask.value.length, ask.value.length);
  };
  window.dictationDone = ({ text, error }) => {
    setMic('off');
    if (text) setAsk((ask.value.trim() ? ask.value.replace(/\s*$/, ' ') : '') + text);
    else if (error) { ask.placeholder = error; setTimeout(() => setMic('off'), 3000); }
    focusInput();
    ask.setSelectionRange(ask.value.length, ask.value.length);
  };

  function show(next, question) {
    const was = phase;
    phase = next;
    $('working').hidden = next !== 'working';
    $('next').hidden = next !== 'working';
    if (was === 'working' && next !== 'working') {
      // The prepared message moves into the line, ready to send.
      const draft = $('nextText').value.trim();
      $('nextText').value = ''; $('nextText').hidden = true; $('next').classList.remove('on');
      if (draft) setAsk(draft);
    }
    $('answer').hidden = next !== 'answer';
    $('inputRow').hidden = next === 'working';
    $('activity').hidden = next !== 'working' || !showActivity;
    $('tokens').hidden = next !== 'working' || !showActivity || !$('tokens').textContent;
    $('stopRow').hidden = next !== 'working' || !showActivity;
    drawTabs();
    if (next === 'working') { $('activity').textContent = ''; $('tokens').textContent = ''; tok = null; }
    if (question !== undefined) { $('askedWorking').textContent = question; $('askedAnswer').textContent = question; }
    clearTimeout(hintTimer);
    $('hint').classList.remove('show');
    if (next !== 'working') focusInput();
    place();
  }

  // The column's top stays at one fixed height and it grows downwards, so typing or switching tabs never makes it jump.
  function place() {
    document.querySelector('.stage').style.setProperty('--top', Math.max(110, Math.round(innerHeight * 0.26)) + 'px');
  }
  addEventListener('resize', place);

  // Claude is asked for plain text, but strip any markdown that slips through.
  function plain(text) {
    return String(text || '')
      .replace(/```[a-z]*\n?([\s\S]*?)```/g, '$1')
      .replace(/^#{1,6}\s+/gm, '')
      .replace(/\*\*(.+?)\*\*/g, '$1').replace(/__(.+?)__/g, '$1')
      .replace(/(^|[^*])\*(?!\s)(.+?)\*/g, '$1$2')
      .replace(/`([^`]+)`/g, '$1')
      .replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, '$1 ($2)')
      .replace(/^\s*[-*]\s+/gm, '·  ')
      .trim();
  }

  function linkify(el, text) {
    el.textContent = '';
    const re = /https?:\/\/[^\s)]+/g;
    let last = 0, m;
    while ((m = re.exec(text))) {
      el.append(text.slice(last, m.index));
      const a = document.createElement('a');
      a.href = m[0]; a.textContent = m[0];
      el.append(a);
      last = m.index + m[0].length;
    }
    el.append(text.slice(last));
  }

  // Every answer is kept; the arrows above an answer step through them.
  let answers = [], answerAt = -1;
  function when(t) {
    if (!t) return '';
    const d = new Date(t * 1000), now = new Date();
    const time = d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
    if (d.toDateString() === now.toDateString()) return time;
    return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) + ', ' + time;
  }
  function showAt(i, anim = true) {
    if (i < 0 || i >= answers.length) return;
    answerAt = i;
    const e = answers[i];
    renderAnswer(e, anim);
  }
  function drawNav() {
    const n = answers.length, i = answerAt;
    $('answerNav').style.visibility = '';
    $('prevAnswer').disabled = i <= 0;
    $('nextAnswer').disabled = i < 0 || i >= n - 1;
    $('answerPos').textContent = n > 1 && i >= 0 ? `${i + 1} of ${n}` : '';
    $('answerWhen').textContent = i >= 0 ? when(answers[i].time) : '';
  }
  window.setAnswers = ({ answers: list, show: visible }) => {
    answers = list || [];
    if (visible && answers.length && phase === 'home' && !ask.value) showAt(answers.length - 1, false);
  };
  window.showAnswer = (entry) => {
    if (entry.tab && entry.tab !== jobs.current) { if (!entry.error) answers.push(entry); return; }  // its tab shows a red dot
    if (!entry.error) { answers.push(entry); answerAt = answers.length - 1; }
    else answerAt = -1;
    renderAnswer(entry, true);
  };
  function closeAnswer() { native({ type: 'dismiss' }); show('home'); }
  $('prevAnswer').addEventListener('click', () => showAt(answerAt - 1));
  $('nextAnswer').addEventListener('click', () => showAt(answerAt + 1));
  $('closeAnswer').addEventListener('click', closeAnswer);
  // Clicking the line beside the prompt shows earlier messages; again hides them.
  document.querySelector('#inputRow .line').addEventListener('click', (e) => {
    e.preventDefault();
    if (phase === 'answer') closeAnswer(); else if (answers.length) showAt(answers.length - 1);
    else { showWho = !showWho; if (!showWho) $('agentMenu').hidden = true; drawAgent(); place(); }
  });
  // From home, the left arrow on an empty line brings the last answer back.
  document.addEventListener('keydown', (e) => {
    if (!e.altKey || page || panel) return;
    if (e.key === 'ArrowLeft') { e.preventDefault(); phase === 'answer' ? showAt(answerAt - 1) : showAt(answers.length - 1); }
    if (e.key === 'ArrowRight' && phase === 'answer') { e.preventDefault(); showAt(answerAt + 1); }
  });

  function renderAnswer({ question, answer, error }, anim) {
    const text = plain(answer);
    const el = $('answerText');
    el.className = 'a' + (text.length > 600 ? ' long' : text.length > 200 ? ' medium' : '') + (error ? ' error' : '');
    linkify(el, text);
    if (error && /went wrong|unexpectedly/.test(text)) {   // one click to what happened, instead of a shortcut
      const a = document.createElement('a');
      a.href = 'kuhaku://details'; a.textContent = 'See what happened';
      el.append(' ', a);
    }
    el.scrollTop = 0;
    if (anim) { $('answer').style.animation = 'none'; void $('answer').offsetWidth; $('answer').style.animation = ''; }
    show('answer', question);
    drawNav();
  }

  $('nextPlus').addEventListener('click', () => {
    const t = $('nextText'); t.hidden = false; $('next').classList.add('on'); t.focus();
  });
  $('nextText').addEventListener('input', () => { const t = $('nextText'); t.style.height = 'auto'; t.style.height = t.scrollHeight + 'px'; });
  $('nextText').addEventListener('keydown', (e) => {
    e.stopPropagation();  // Esc here must not stop Claude
    if (e.key === 'Escape') { $('nextText').value = ''; $('nextText').hidden = true; $('next').classList.remove('on'); $('nextText').blur(); }
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('nextText').blur(); }
  });

  // Drafts survive restarts: whatever is in the line (or prepared as next) is kept by Kūhaku.
  var draftT;
  function keepDraft() {
    clearTimeout(draftT);
    const d = { type: 'draft', tab: jobs.current, text: ask.value, next: $('nextText').value };   // for the tab it was typed in
    draftT = setTimeout(() => native(d), 400);
  }
  ask.addEventListener('input', keepDraft);
  $('nextText').addEventListener('input', keepDraft);
  window.setDraft = ({ text, next }) => {
    if (text && !ask.value) setAsk(text);
    if (next) {
      if (phase === 'working') { $('nextText').value = next; $('nextText').hidden = false; $('next').classList.add('on'); }
      else if (!ask.value) setAsk(next);
    }
  };

  // ---- Jobs as tabs -------------------------------------------------------
  let jobs = { tabs: [], current: null, agents: [] }, renaming = null;
  const agentName = (id) => (jobs.agents.find((a) => a.id === (id || '')) || { name: 'Claude' }).name;
  const escT = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const curTab = () => jobs.tabs.find((t) => t.id === jobs.current);
  const atTime = (ts) => new Date(ts * 1000).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
  function drawTabs() {
    drawAgent();
    if (renaming) return;   // never pull the name field away while it is being typed
    const nav = $('jobTabs');
    nav.hidden = !(jobs.tabs.length > 1 || phase === 'working');
    nav.innerHTML = '<div class="jobscroll" id="jobScroll">' + (jobs.tabs.length > 1 || phase === 'working' ? jobs.tabs.map((t) => {
      const mark = t.status === 'running' ? 'run' : t.status === 'queued' ? 'queued' : t.unseen ? 'unseen' : 'idle';
      const extra = t.status === 'queued' && t.at ? `<small>${atTime(t.at)}</small>` : t.status === 'queued' && t.place ? `<small>${t.place}</small>` : '';
      const who = [t.agent ? agentName(t.agent) : '', t.anon ? 'anonymous' : ''].filter(Boolean).join(' · ');
      const busy = t.status === 'running' || t.status === 'queued' ? ' busy' : '';
      return `<span class="jobtab${t.id === jobs.current ? ' on' : ''}${busy}" data-tab="${t.id}" title="${escT(t.note || [t.title || 'New', who].filter(Boolean).join(' · '))}">` +
        `<i class="${mark}"></i><b>${escT(t.title || 'New')}</b>${who ? `<small>${escT(who)}</small>` : ''}${extra}<button class="x" data-close="${t.id}" title="${t.anon ? 'Close and erase (Ctrl+W)' : busy ? 'Stop and close (Ctrl+W) · kept in Kiroku' : 'Close (Ctrl+W)'}">×</button></span>`;
    }).join('') : '') + '</div>' +
      '<button class="jobplus" id="jobPlus" title="Another job, side by side (Ctrl+T)"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>';
    const on = nav.querySelector('.jobtab.on');
    if (on) on.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    tabFades();
    // The open tab waiting in line: why, and what can be done about it.
    const t = curTab(), waiting = phase === 'working' && t && t.status === 'queued';
    $('working').classList.toggle('waiting', !!waiting);
    $('queueRow').hidden = !waiting;
    if (waiting) {
      $('queueNote').textContent = t.at ? 'Starts at ' + atTime(t.at) : t.note || (t.place > 1 ? `Number ${t.place} in line` : 'Starting…');
      $('qFirst').classList.toggle('on', t.priority === 2);
      $('qNow').hidden = !t.at;
    }
  }
  // Who does the job stays out of sight until the red line is clicked (earlier answers, or the line alone).
  const askWho = (id) => (id || '').startsWith('agent:') ? agentName(id) : 'Claude';
  function drawAgent() {
    const t = curTab(), many = jobs.agents.length > 1;
    if (phase === 'working') showWho = false;
    $('agentBtn').hidden = !many || !(showWho || phase === 'answer');
    if ($('agentBtn').hidden) $('agentMenu').hidden = true;
    $('agentBtn').textContent = agentName(t?.agent) + (t?.anon ? ' · anonymous' : '');
    if (dictation === 'off') ask.placeholder = 'Ask ' + askWho(t?.agent);
    if (!many) $('agentMenu').hidden = true;
    if (!$('agentMenu').hidden) $('agentMenu').innerHTML = jobs.agents.map((a) =>
      `<button data-agent="${escT(a.id)}" class="${a.id === (t?.agent || '') ? 'on' : ''}">${escT(a.name)}${a.about ? `<small>${escT(a.about)}</small>` : ''}</button>`).join('') +
      `<button data-anon class="anon${t?.anon ? ' on' : ''}">Anonymous${t?.anon ? ' · on' : ''}<small>not kept in Kiroku or any log; erased from this computer when the tab closes (Anthropic still processes it). Starts a fresh conversation.</small></button>`;
  }
  $('agentBtn').addEventListener('click', (e) => {
    e.preventDefault();
    $('agentMenu').hidden = !$('agentMenu').hidden; drawAgent(); place();
  });
  $('agentMenu').addEventListener('click', (e) => {
    if (e.target.closest('[data-anon]')) {
      $('agentMenu').hidden = true;
      tabDo('anon', jobs.current);
      const t = curTab(); if (t) t.anon = !t.anon;
      show('home'); drawTabs(); place(); return;
    }
    const b = e.target.closest('[data-agent]'); if (!b) return;
    $('agentMenu').hidden = true;
    tabDo('agent', jobs.current, { agent: b.dataset.agent });
    const t = curTab(); if (t) t.agent = b.dataset.agent;
    drawTabs(); place();
  });
  function startRename(id) {
    const b = document.querySelector(`.jobtab[data-tab="${id}"] b`), t = jobs.tabs.find((x) => x.id === id);
    if (!b || !t || renaming) return;
    renaming = id;
    const inp = document.createElement('input');
    inp.className = 'tabname'; inp.value = t.title || ''; inp.placeholder = 'Name'; inp.spellcheck = false;
    const fit = () => { inp.style.width = Math.max(40, Math.min(240, inp.value.length * 8 + 12)) + 'px'; };
    fit(); b.replaceWith(inp); inp.focus(); inp.select();
    let done = false;
    const finish = (save) => {
      if (done) return; done = true; renaming = null;
      const v = inp.value.trim();
      if (save && v !== (t.title || '')) { t.title = v || t.title; tabDo('rename', id, { title: v }); }
      drawTabs(); focusInput();
    };
    inp.addEventListener('input', fit);
    inp.addEventListener('keydown', (e) => {
      e.stopPropagation();   // Esc here must not stop Claude, Ctrl+W must not close the tab
      if (e.key === 'Enter') { e.preventDefault(); finish(true); }
      if (e.key === 'Escape') { e.preventDefault(); finish(false); }
    });
    inp.addEventListener('blur', () => finish(true));
    inp.addEventListener('click', (e) => e.stopPropagation());
  }
  window.setTabs = (j) => {
    const was = jobs.current; jobs = Object.assign({ agents: [] }, j);
    const t = curTab();
    if (was === jobs.current && t && phase === 'working' && t.status === 'idle' && !t.answer) { /* the answer arrives on its own */ }
    drawTabs();
  };
  // Each tab keeps its own view, its own typed text and its own prepared next message.
  window.restoreTab = ({ id, status, question, activity, tokens, answer, draft, next }) => {
    if (id) jobs.current = id;
    clearTimeout(draftT);
    const busy = status === 'running' || status === 'queued';
    $('nextText').value = ''; $('nextText').hidden = true; $('next').classList.remove('on');
    $('agentMenu').hidden = true;
    if (busy) {
      show('working', question);
      (activity || []).forEach((a) => addActivity(a));
      if (tokens) setTokens(tokens);
    } else if (answer) { answerAt = answers.findIndex((a) => a.time === answer.time && a.question === answer.question); renderAnswer(answer, true); }
    else show('home');
    ask.value = draft || ''; grow();
    if (next && busy) { $('nextText').value = next; $('nextText').hidden = false; $('next').classList.add('on'); }
    else if (next && !ask.value) { ask.value = next; grow(); }
    drawTabs(); focusInput();
  };
  // Leaving a tab takes what was typed there along, so it is waiting when you come back.
  const tabDo = (action, id, extra) => {
    const leaving = action === 'new' || action === 'open' || action === 'close';
    if (leaving) clearTimeout(draftT);
    native(Object.assign({ type: 'tab', action, id }, leaving ? { draft: ask.value, next: $('nextText').value } : {}, extra || {}));
  };
  $('jobTabs').addEventListener('click', (e) => {
    const x = e.target.closest('[data-close]'); if (x) { e.stopPropagation(); return tabDo('close', x.dataset.close); }
    if (e.target.closest('#jobPlus')) return tabDo('new');
    const t = e.target.closest('[data-tab]'); if (!t) return;
    if (t.dataset.tab !== jobs.current) tabDo('open', t.dataset.tab);
    else if (e.target.closest('b')) startRename(t.dataset.tab);
  });
  // Tabs live on one line: the wheel scrolls it sideways, the edges fade where more tabs hide.
  function tabFades() {
    const n = $('jobScroll'); if (!n) return;
    n.classList.toggle('less', n.scrollLeft > 1);
    n.classList.toggle('more', n.scrollLeft + n.clientWidth < n.scrollWidth - 1);
  }
  $('jobTabs').addEventListener('scroll', tabFades, { passive: true, capture: true });
  window.addEventListener('resize', tabFades);
  $('jobTabs').addEventListener('wheel', (e) => {
    const n = $('jobScroll'); if (!n) return;
    if (n.scrollWidth <= n.clientWidth || Math.abs(e.deltaX) > Math.abs(e.deltaY)) return;
    e.preventDefault(); n.scrollLeft += e.deltaY;
  }, { passive: false });
  $('jobTabs').addEventListener('dblclick', (e) => {
    const t = e.target.closest('[data-tab]'); if (t && t.dataset.tab === jobs.current) startRename(t.dataset.tab);
  });
  $('qFirst').addEventListener('click', () => tabDo('first', jobs.current));
  $('qNow').addEventListener('click', () => tabDo('now', jobs.current));
  $('qLeave').addEventListener('click', () => { native({ type: 'cancel' }); show('home'); });
  document.addEventListener('keydown', (e) => {
    if (!e.ctrlKey || page || panel) return;
    if (e.key === 't') { e.preventDefault(); tabDo('new'); }
    else if (e.key === 'w' && (jobs.tabs.length > 1 || phase === 'working')) { e.preventDefault(); tabDo('close', jobs.current); }
    else if (e.key === 'Tab' && jobs.tabs.length > 1) {
      e.preventDefault();
      const i = jobs.tabs.findIndex((t) => t.id === jobs.current), n = jobs.tabs.length;
      tabDo('open', jobs.tabs[(i + (e.shiftKey ? n - 1 : 1)) % n].id);
    } else if (/^[1-9]$/.test(e.key) && jobs.tabs[+e.key - 1]) { e.preventDefault(); tabDo('open', jobs.tabs[+e.key - 1].id); }
  });

  window.resetConversation = () => { setAsk(''); show('home'); };
  window.focusInput = () => { if (!renaming && phase !== 'working' && $('sheet').hidden && !panel && !page) ask.focus(); };

  ask.addEventListener('keydown', (e) => {

    h += `<div class="p-label" id="sec-claude"><span>AI</span></div><div class="p-rows">
      <div class="aigrid"><span></span>${KIND.map(([, l]) => `<span class="aihead">${l}</span>`).join('')}<span></span>
        ${sets.map((set) => `<span class="k">${esc(set.name)}</span>${KIND.map(([k]) => `<span>${slot(set, k)}</span>`).join('')}
          <span>${set.removable ? `<span class="opt aidel" data-act2="ai-set-remove" data-v="${esc(set.name)}">Remove</span>` : ''}</span>`).join('')}
      </div>
      ${(() => { const L = p.ai_local || {};
        // A model on this computer (Ollama), for people who want to try Kūhaku without a cloud AI.
        const body = L.running && L.models.length ? OPT('local_model', L.models.map((m) => [m, esc(m)]), L.model)
          : `<span class="grow">${L.running ? 'Ollama runs, without a model yet · <a class="p-link" href="https://ollama.com/library">Pick a model</a>'
            : L.installed ? 'Ollama is here but not running'
            : 'A model on this computer, through Ollama · <a class="p-link" href="https://ollama.com/download">Get Ollama</a>'}</span>`;
        return `<div class="srow"><span class="k">Local</span>${body}</div>`; })()}
      <div class="srow"><span class="k"></span><div class="grow">${acctAdding
        ? '<label class="acctadd"><span class="line"></span><input id="acctNew" placeholder="Name of the set, like Client" spellcheck="false"></label>'
        : '<div class="opts"><span class="opt" data-act2="ai-set-add">Add a set</span></div>'}</div></div>
      <div class="srow"><span class="k">Home uses</span>${OPT('home_set', sets.map((x) => [x.name, esc(x.name) + ' Claude']), home.set)}</div>
      ${[['mail', 'Mail uses'], ['dev', 'Dev tools use']].map(([k, label]) =>
        `<div class="srow"><span class="k">${label}</span>${OPT('account_' + k, [['', 'Same as home']].concat(ready.map((a) => [a.id, esc(a.label)])), (p.account_for || {})[k] || '')}</div>`).join('')}
      <div class="srow"><span class="k">Model</span>${OPT('model', [['default', 'Default'], ['opus', 'Opus'], ['sonnet', 'Sonnet'], ['haiku', 'Haiku']], p.model)}</div>
      <div class="srow"><span class="k">May do</span>${OPT('permission_mode', [['bypassPermissions', 'Anything, without asking'], ['acceptEdits', 'Careful: edit files, no commands']], p.permission_mode === 'default' ? 'acceptEdits' : p.permission_mode)}</div>
      <div class="srow"><span class="k">Dictation</span>${OPT('dictation_model', [['base', 'Fast'], ['small', 'Accurate, slower']], p.dictation_model)}</div></div>`;
    const u = p.updates || {};
    h += `<div class="p-label" id="sec-updates"><span>Updates</span></div><div class="p-rows">
      <div class="srow"><span class="k">Updates</span><span class="grow">${u.auto ? 'Security fixes install by themselves' : 'Not automatic'}${u.checked ? ' · last ' + when(u.checked) : ''}</span>
        <button class="p-link" data-pref-btn="update-now">${u.running ? 'Updating…' : 'Update now'}</button></div></div>`;
    const a = p.about;
    h += `<div class="p-label" id="sec-about"><span>This computer</span></div><div class="p-rows">` +
      [['Computer', a.computer], ['System', a.system + ' · Kūhaku'], ['Processor', a.processor], ['Memory', a.memory && a.memory + ' GB'],
       ['Storage', a.disk && `${a.disk[0]} GB free of ${a.disk[1]} GB`], ['Kernel', a.kernel]]
        .filter(([, v]) => v).map(([k, v]) => `<div class="srow"><span class="k">${k}</span><span class="grow">${esc(v)}</span></div>`).join('') + '</div>';
    const tools = (appList || []).filter((x) => x.system);
    if (tools.length) h += `<div class="p-label"><span>System tools</span></div><div class="tools">` +
      tools.map((t) => `<span data-act2="tool" data-v="${esc(t.id)}">${esc(t.name)}</span>`).join('') + '</div>';
    $('page').innerHTML = h + '</div>';
    // Opened for one thing (power, from the battery): only that part shows, and the rest is one click away.
    if (onlySection) {
      const keep = document.getElementById('sec-' + onlySection);
      if (keep) {
        const inner = $('page').querySelector('.inner');
        [...inner.children].forEach((n) => { if (n !== keep && n !== keep.nextElementSibling && n.tagName !== 'H1') n.remove(); });
        inner.querySelector('h1').textContent = keep.textContent.trim().replace(/^./, (c) => c.toUpperCase());
        inner.insertAdjacentHTML('beforeend', '<div class="p-foot"><button class="p-link" data-act2="all-settings">All settings</button></div>');
      }
    }
  }

  function screensHtml(d) {
    if (!d) return '';
    const outs = d.outputs || [];
    const nice = (o) => o.builtin ? 'Built-in display' : o.name.replace(/-\d+$/, '').replace('HDMI', 'HDMI display').replace(/^DP$/, 'DisplayPort display');
    let h = outs.map((o) => `<div class="srow"><span class="k">${outs.length > 1 ? esc(nice(o)) : 'Resolution'}</span>` +
      '<div class="opts grow">' + o.modes.map((m) =>
        `<span class="opt${m === o.current ? ' sel' : ''}" data-disp='${JSON.stringify({ output: o.name, mode: m })}'>${m.replace('x', ' × ')}</span>`).join('') + '</div></div>').join('');
    if (outs.length > 1) h += `<div class="srow"><span class="k">Arrangement</span><div class="opts grow">` +
      [['left', 'Left of laptop'], ['right', 'Right of laptop'], ['mirror', 'Mirror'], ['outer', 'Only external'], ['inner', 'Only laptop']]
        .map(([v, l]) => `<span class="opt" data-disp='${JSON.stringify({ arrange: v })}'>${l}</span>`).join('') + '</div></div>';
    h += `<div class="srow"><span class="k">Text size</span><div class="opts grow">` +
      [[84, 'Smaller'], [96, 'Default'], [120, 'Larger'], [144, 'Largest']]
        .map(([v, l]) => `<span class="opt${v === d.dpi ? ' sel' : ''}" data-disp='${JSON.stringify({ dpi: v })}'>${l}</span>`).join('') + '</div></div>';
    return h;
  }

  $('page').addEventListener('click', (e) => {
    const disp = e.target.closest('[data-disp]');
    if (disp) {
      disp.parentElement.querySelectorAll('.opt').forEach((x) => x.classList.toggle('sel', x === disp));
      return native({ type: 'panel', action: 'pref', key: 'display', value: JSON.parse(disp.dataset.disp) });
    }
    const app = e.target.closest('[data-app]'); if (app) return launch(app.dataset.app);
    const o = e.target.closest('[data-pref]');
    if (o) {
      // A set whose Claude is not signed in yet is not chosen by a click; it opens its sign-in.
      if (!(o.dataset.pref === 'home_set' && !(((prefs.ai_sets || []).find((x) => x.name === o.dataset.v) || {}).slots || {}).claude?.signedIn))
        o.parentElement.querySelectorAll('.opt').forEach((x) => x.classList.toggle('sel', x === o));
      return native({ type: 'panel', action: 'pref', key: o.dataset.pref, value: o.dataset.v });
    }
    const ub = e.target.closest('[data-pref-btn]');
    if (ub) { ub.textContent = 'Updating…'; return native({ type: 'panel', action: 'pref', key: ub.dataset.prefBtn, value: 1 }); }
    const t = e.target.closest('[data-act2]'); if (!t) return;
    if (t.dataset.act2 === 'tool') launch(t.dataset.v);
    if (t.dataset.act2 === 'time-set') native({ type: 'panel', action: 'pref', key: 'time_set', value: $('timeSet').value });
    if (t.dataset.act2 === 'all-settings') { onlySection = null; renderSettings(); $('page').scrollTop = 0; }
    if (t.dataset.act2 === 'ai-signin') native({ type: 'panel', action: 'ai-signin', set: t.dataset.set, kind: t.dataset.v });
    if (t.dataset.act2 === 'ai-set-remove') native({ type: 'panel', action: 'ai-set-remove', name: t.dataset.v });
    if (t.dataset.act2 === 'ai-set-add') { acctAdding = true; renderSettings(); const i = $('acctNew'); i.focus();
      i.addEventListener('keydown', (e) => { if (e.key === 'Escape') { acctAdding = false; renderSettings(); }
        if (e.key === 'Enter' && i.value.trim()) { acctAdding = false; native({ type: 'panel', action: 'ai-set-add', name: i.value.trim() }); } }); }
    if (t.dataset.act2 === 'battery') { closePage(); openPanel('battery'); }
    if (t.dataset.act2 === 'wifi') { closePage(); openPanel('wifi'); }
  });
  $('page').addEventListener('change', (e) => {
    if (e.target.id === 'timeZone' && e.target.value.trim()) native({ type: 'panel', action: 'pref', key: 'time_zone', value: e.target.value.trim() });
  });
  let slideTimer = 0;
  function slideTo(el, x) {
    const r = el.getBoundingClientRect(), key = el.dataset.slide;
    const v = Math.round(Math.max(key === 'brightness' ? 5 : 0, Math.min(100, (x - r.left) / r.width * 100)));
    el.querySelector('i').style.width = v + '%'; el.querySelector('b').style.left = v + '%';
    $('val-' + key).textContent = v + '%';
    if (prefs) prefs[key] = v;
    const now = Date.now();
    if (now - slideTimer > 90) { slideTimer = now; native({ type: 'panel', action: 'pref', key, value: v, quiet: true }); }
    return v;
  }
  $('page').addEventListener('pointerdown', (e) => {
    const el = e.target.closest('.slider'); if (!el) return;
    dragging = el; el.classList.add('drag'); el.setPointerCapture(e.pointerId); slideTo(el, e.clientX);
  });
  $('page').addEventListener('pointermove', (e) => { if (dragging) slideTo(dragging, e.clientX); });
  $('page').addEventListener('pointerup', (e) => {
    if (!dragging) return;
    const el = dragging, v = slideTo(el, e.clientX);
    dragging = null; el.classList.remove('drag');
    native({ type: 'panel', action: 'pref', key: el.dataset.slide, value: v, quiet: true });
  });

  window.setRecording = (on) => { $('recBtn').hidden = !on; };
  $('recBtn').addEventListener('click', () => native({ type: 'stopRecording' }));

  const params = new URLSearchParams(location.search);
  if (params.get('theme')) setTheme(params.get('theme'));
  focusInput();
  place();
</script>
</body>
</html>

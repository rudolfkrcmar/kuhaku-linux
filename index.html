<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kūhaku</title>
<link rel="stylesheet" href="home/home.css">
<link rel="stylesheet" href="pick/picker.css">
</head>
<body>

<nav class="lead" aria-label="Quick start">
  <button class="menu" id="menu" aria-label="Open menu" title="Menu"><span></span></button>
  <button class="rundot" id="runDot" title="Open apps" aria-label="Open apps" hidden><span></span></button>
  <span class="leadsep" aria-hidden="true"></span>
  <div class="quick" id="quick">
    <button data-launch="miru.desktop" title="Miru · files" aria-label="Miru"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.33"><path d="M4 9h16"/><path class="hot" d="M4 15h16"/></svg></button>
    <button data-launch="com.anthropic.Claude.desktop" title="Claude" aria-label="Claude"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.33"><path d="M12 4v16M4 12h16M6.34 17.66L17.66 6.34"/><path class="hot" d="M6.34 6.34l11.32 11.32"/></svg></button>
    <button data-launch="mado.desktop" title="Mado" aria-label="Mado"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.33"><path d="M7 9h10v10H7z"/><path class="hot" d="M6 5h12"/></svg></button>
    <button data-launch="tegami.desktop" title="Tegami" aria-label="Tegami"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.33"><path d="M4.5 8l7.5 7.5L19.5 8"/><path class="hot" d="M3.5 8h17"/></svg></button>
    <button data-launch="tsukuru.desktop" title="Tsukuru" aria-label="Tsukuru"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.33"><path d="M9 4v16"/><path class="hot" d="M15 4v16"/></svg></button>
  </div>
</nav>
<div class="status">
  <button class="stat rec" id="recBtn" title="Stop recording and save it to Videos (Cmd+Shift+5)" hidden><span class="rdot"></span>Stop</button>
  <button class="stat recmic" id="recMicBtn" title="Switch the microphone in this recording" hidden><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10 4h4v9h-4zM6.5 10.5a5.5 5.5 0 0 0 11 0M12 16v4"/><path class="strike" d="M4 20L20 4"/></svg></button>
  <button class="stat acct" id="acctBtn" title="Claude account: click to switch" hidden><span id="acctName" hidden></span><svg class="acctIcon" id="acctHome" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M7 9v10h10V9"/><path class="acc" d="M4 12l8-8 8 8"/></svg><svg class="acctIcon" id="acctWork" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true" hidden><path d="M7 8v11M17 8v11"/><path class="acc" d="M4 8h16"/></svg></button>
  <span class="icons">
    <button class="stat" id="wifiBtn" title="Connections: Wi‑Fi, VPN, Bluetooth"><svg id="wifi" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path class="l1" d="M6 15v4"/><path class="l2" d="M12 10v9"/><path class="l3 hot" d="M18 5v14"/></svg></button>
    <button class="stat" id="batteryWrap" title="">
      <svg width="18" height="6" viewBox="0 0 18 6"><rect width="18" height="6" fill="currentColor" opacity=".18"/><rect id="batteryFill" width="12" height="6" fill="currentColor"/><rect id="batteryTick" x="14" width="1" height="6" fill="currentColor" visibility="hidden"/></svg>
    </button>
  </span>
  <span class="datetime">
    <button class="stat" id="calBtn" title="Calendar"><span id="date"></span></button>
    <button class="stat" id="timeBtn" title="Day, night or auto"><span class="time" id="clock"></span></button>
  </span>
</div>

<main class="stage">
  <div class="column">
    <nav class="jobtabs" id="jobTabs" hidden></nav>
    <div class="next" id="next" hidden>
      <button class="plus" id="nextPlus" title="Prepare your next message"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="plus hist" id="peekBtn" title="Earlier messages as a chat, while Claude works" aria-label="Earlier messages as a chat" hidden><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 9h10M10 15h10"/></svg></button>
      <textarea id="nextText" rows="1" placeholder="Next message" spellcheck="false" hidden></textarea>
    </div>
    <div class="row" id="working" hidden>
      <button class="dotHit" id="dot" title="What Claude is doing"><span class="dot" role="status" aria-label="Claude is working"></span></button>
      <p class="asked-working" id="askedWorking"></p>
    </div>
    <ul class="activity" id="activity" hidden></ul>
    <p class="tokens" id="tokens" hidden></p>
    <div class="queuerow" id="queueRow" hidden><span id="queueNote"></span><button id="qFirst">Put first</button><button id="qNow" hidden>Start now</button><button id="qLeave">Take out of the line</button></div>
    <div class="stoprow" id="stopRow" hidden><button id="stopBtn" aria-label="Stop"><i></i><span>Stop</span></button></div>

    <div class="answer" id="answer" hidden>
      <div class="nav" id="answerNav">
        <button id="prevAnswer" title="Earlier answer (Alt+Left)"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg></button>
        <button class="pos" id="answerPos" title="All answers"></button>
        <button id="nextAnswer" title="Later answer (Alt+Right)"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5l7 7-7 7"/></svg></button>
        <span class="when" id="answerWhen"></span>
        <button class="hist" id="chatBtn" title="This conversation as a chat" aria-label="Show as chat"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9h10M10 15h10"/></svg></button>
        <button class="close" id="closeAnswer" title="Close (Esc)"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <p class="q" id="askedAnswer"></p>
      <p class="a" id="answerText"></p>
      <div class="opened" id="answerOpened" hidden></div>
      <div class="list" id="answerList" hidden></div>
      <div class="chat" id="answerChat" hidden></div>
    </div>

    <label class="row" id="inputRow">
      <span class="line" aria-hidden="true"></span>
      <textarea id="ask" rows="1" placeholder="Ask Claude" autocomplete="off" spellcheck="false" autofocus></textarea>
      <span class="tools">
        <button class="mic" id="mic" title="Talk with Claude (Ctrl+Space)" aria-label="Talk with Claude"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.33"><path d="M7 9v6M12 5v14M17 9v6"/></svg></button>
        <button class="mic" id="histBtn" title="Earlier messages as a chat" aria-label="Earlier messages as a chat" hidden><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.33"><path d="M4 9h10M10 15h10"/></svg></button>
        <button class="mic" id="pic" title="Add a file for Claude" aria-label="Add a file for Claude"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.33"><path d="M4 5h16v14H4z"/><path class="dot hot" d="M12.09 12.5A3.5 3.5 0 1 1 14.51 14.42A12 12 0 0 1 13.5 12.5z"/><path d="M4 19A12 12 0 0 0 10.5 12.5H13.5A12 12 0 0 0 20 19"/></svg></button>
      </span>
    </label>
    <button class="agent" id="agentBtn" title="Who does this job" hidden></button>
    <div class="agentmenu" id="agentMenu" hidden></div>
  </div>
</main>

<div class="hint" id="hint"></div>

<div class="scrim" id="scrim" hidden></div>
<div class="pscrim" id="pscrim" hidden></div>
<div class="page" id="page" hidden></div>
<button class="pageclose" id="pageClose" title="Close (Esc)" aria-label="Close" hidden><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
<div class="panel" id="panel" hidden></div>
<div class="picks" id="picks" hidden></div>
<div class="peek" id="peek" hidden></div>
<div class="sheet" id="sheet" hidden>
  <div class="srow3">
    <button data-id="apps" title="Apps" aria-label="Apps"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><circle class="dot" cx="6" cy="12" r="1.5"/><circle class="dot" cx="12" cy="12" r="1.5"/><circle class="dot hot" cx="18" cy="12" r="1.5"/></svg></button>
    <button data-id="terminal" title="Terminal" aria-label="Terminal"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><path d="M5 7l5 5-5 5"/><path class="hot" d="M13 17h6"/></svg></button>
    <button data-id="kansei" title="Kansei" aria-label="Kansei"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><path d="M4 15h5V9h6v6h5"/><path class="hot" d="M9.75 9h4.5"/></svg></button>
    <button data-id="kiroku" title="Kiroku" aria-label="Kiroku"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><path d="M4 7h16M4 12h16"/><path class="hot" d="M4 17h9"/></svg></button>
  </div>
  <div class="srow3">
    <button data-id="sound" title="Sound" aria-label="Sound"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><path d="M6 10v4M14 8v8M18 11v2"/><path class="hot" d="M10 5v14"/></svg></button>
    <button data-id="network" title="Wi‑Fi" aria-label="Wi‑Fi"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><path d="M6 15v4M12 10v9"/><path class="hot" d="M18 5v14"/></svg></button>
    <button data-id="display" title="Display" aria-label="Display"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><path d="M4 5h16v11H4z"/><path class="hot" d="M9 20h6"/></svg></button>
    <button data-id="settings" title="Settings" aria-label="Settings"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><path d="M4 12h8"/><path class="hot" d="M15 9h6v6h-6z"/></svg></button>
  </div>
  <div class="srow3">
    <button data-id="screenshot" title="Screenshot" aria-label="Screenshot"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><path d="M4 8V4h4M16 4h4v4M20 16v4h-4M8 20H4v-4"/><path class="hot" d="M10.5 12h3"/></svg></button>
    <button data-id="record" title="Record the screen" aria-label="Record the screen"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><path d="M4 5h16v11H4zM9 20h6"/><circle class="dot hot" cx="12" cy="10.5" r="1.5"/></svg></button>
  </div>
  <div class="srow3">
    <button data-id="lock" title="Lock" aria-label="Lock"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><path d="M6 11h12v9H6z"/><path class="hot" d="M9 11V5h6v6"/></svg></button>
    <button data-id="logout" title="Log out" aria-label="Log out"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><path d="M10 4H5v16h5"/><path class="hot" d="M11 12h9M16.5 8.5L20 12l-3.5 3.5"/></svg></button>
    <button data-id="restart" title="Restart" aria-label="Restart"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><path d="M19 12a7 7 0 1 1-2.05-4.95"/><path class="hot" d="M17 3v4h-4"/></svg></button>
    <button data-id="shutdown" title="Shut down" aria-label="Shut down"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><path d="M7.5 7.64a7 7 0 1 0 9 0"/><path class="hot" d="M12 4v8"/></svg></button>
  </div>
  <div class="cap" id="sheetCap"></div>
</div>

<div class="runs" id="runs" hidden></div>

<script src="home/core.js"></script>
<script src="home/tabs.js"></script>
<script src="home/panels.js"></script>
<script src="home/pages.js"></script>
<script src="pick/picker.js"></script>
<script src="home/pictures.js"></script>
</body>
</html>

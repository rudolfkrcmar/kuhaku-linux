<!doctype html>
<html><head><meta charset="utf-8"><title>Tegami</title>
<style>
  /* Tegami v2 (Claude Design, 11 Oct 2026): one calm column. Today is a short brief and the letters to read in order;
     folders wait in a drawer behind the top-left button. Two looks: Kūhaku (lines, no boxes) and Modern (soft cards). */
  :root { --font:'Inter Variable','Inter',system-ui,sans-serif; --mono:'JetBrains Mono','JetBrains Mono NL',monospace;
          --bg:#f7f4f1; --fg:#111111; --muted:#666666; --faint:rgba(17,17,17,.05); --line:rgba(17,17,17,.09); --accent:#e0301e;
          --sheet:#f7f4f1; --surface:#ffffff; --glow:transparent;
          --r:0px; --r2:0px; --rp:0px; --bd:1px solid transparent; --btn-bg:transparent; --btn-fg:var(--fg); --btn-ul:inset 0 -1.5px 0 var(--accent);
          --send-fg:var(--accent); --b2-bg:var(--faint); --b2-bd:1px solid transparent; --pill-pad:0 0 0 9px; --ask-sh:inset 2px 0 0 var(--accent); }
  body.night { --bg:#121212; --fg:#ececec; --muted:#9a9a9a; --faint:rgba(236,236,236,.05); --line:rgba(236,236,236,.09); --accent:#f0705a;
               --sheet:#121212; --surface:#1b1b1b; }
  body.modern { --font:'Geist','Inter Variable','Inter',system-ui,sans-serif; --bg:#f4f2ef; --muted:#6b6b6b; --faint:rgba(17,17,17,.06); --line:rgba(17,17,17,.12);
                --sheet:#ffffff; --surface:#ffffff; --glow:rgba(224,48,30,.14);
                --r:14px; --r2:8px; --rp:999px; --bd:1px solid var(--line); --btn-bg:var(--accent); --btn-fg:#fff; --btn-ul:none; --send-fg:#fff;
                --b2-bg:var(--sheet); --b2-bd:1px solid var(--line); --pill-pad:2px 9px; --ask-sh:0 24px 60px -24px var(--glow), 0 0 0 4px var(--faint); }
  body.modern.night { --bg:#0c0c0d; --fg:#ededed; --muted:#8f8f8f; --faint:rgba(255,255,255,.05); --line:rgba(255,255,255,.1); --accent:#f0705a;
                      --sheet:#141415; --surface:#141415; --glow:rgba(240,112,90,.16); }
  html, body { margin:0; height:100%; overflow:hidden; }
  body { font-family:var(--font); font-weight:300; color:var(--fg); -webkit-font-smoothing:antialiased; display:flex; flex-direction:column;
         background:radial-gradient(ellipse 70% 45% at 50% -5%, var(--glow), transparent 70%), var(--bg); }
  button, input, textarea, select { font:inherit; }
  button { color:inherit; }
  input::placeholder, textarea::placeholder { color:var(--muted); opacity:.8; }
  a { color:inherit; text-decoration-color:var(--accent); text-underline-offset:3px; }
  a:hover { color:var(--accent); }
  [hidden] { display:none !important; }
  .mono { font-family:var(--mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
  .grow { flex:1; }

  /* The bar */
  .bar { height:56px; flex-shrink:0; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; padding:0 20px; position:relative; z-index:5; }
  .bar .l, .bar .r { display:flex; align-items:center; }
  .bar .l { gap:14px; }
  .bar .r { justify-content:flex-end; gap:4px; }
  .ib { width:34px; height:34px; border:0; background:none; cursor:pointer; color:var(--muted); display:flex; align-items:center; justify-content:center;
        border-radius:var(--r2); padding:0; flex-shrink:0; }
  .ib:hover { color:var(--fg); background:var(--faint); }
  .bar .ib:hover { background:none; }
  .ib.write { color:var(--fg); }
  .ib.write:hover { color:var(--accent); }
  .ib.on { color:var(--accent); }
  .name { display:flex; align-items:center; gap:10px; font-size:14px; font-weight:400; }
  .name i { width:2px; height:18px; background:var(--accent); }
  .name i.pulse { animation:pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:.15 } }
  .state { font-family:var(--mono); font-size:11px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .seg { display:flex; gap:2px; padding:3px; border:var(--bd); border-radius:var(--rp); background:var(--sheet); }
  .seg button { display:flex; align-items:center; gap:8px; border:0; cursor:pointer; padding:6px 16px; border-radius:var(--rp); font-size:13px; font-weight:400;
                background:transparent; color:var(--muted); }
  .seg.small button { padding:5px 12px; font-size:12.5px; font-weight:300; }
  .seg button:hover { color:var(--fg); }
  .seg button.on { color:var(--fg); box-shadow:inset 0 -1.5px 0 var(--accent); }
  body.modern .seg button.on { background:var(--fg); color:var(--bg); box-shadow:none; }
  .seg button i, .dot { width:6px; height:6px; border-radius:50%; flex-shrink:0; display:inline-block; }
  .calmb { height:34px; min-width:34px; padding:0 8px; box-sizing:border-box; border:0; background:none; cursor:pointer; display:flex; align-items:center;
           justify-content:center; gap:8px; position:relative; font-size:12.5px; color:var(--muted); }
  .calmb:hover, .calmb.on { color:var(--fg); }
  .calmb .lbl { display:none; white-space:nowrap; }
  .calmb:hover .lbl { display:inline; }
  .calmb b { position:absolute; top:2px; right:0; min-width:16px; height:16px; padding:0 4px; box-sizing:border-box; border-radius:var(--rp); background:var(--accent);
             color:#fff; font-family:var(--mono); font-size:10px; font-weight:400; display:inline-flex; align-items:center; justify-content:center; }

  /* Drawer and column */
  .body { flex:1; min-height:0; display:flex; padding-bottom:12px; box-sizing:border-box; }
  .drawer { width:0; flex-shrink:0; overflow:hidden; transition:width .28s cubic-bezier(.2,.8,.2,1); }
  .drawer > div { width:236px; height:100%; padding:22px 0 0 32px; box-sizing:border-box; overflow:auto; scrollbar-width:none;
                  transform:translateX(-24px); opacity:0; transition:transform .28s cubic-bezier(.2,.8,.2,1), opacity .2s; }
  body.dopen .drawer { width:236px; }
  body.dopen .drawer > div { transform:none; opacity:1; }
  .dh { display:flex; align-items:center; gap:10px; padding:14px 16px 6px 0; cursor:pointer; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }
  .dh:hover { color:var(--fg); }
  .dh > i { width:2px; height:12px; flex-shrink:0; }
  .dh span { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .dh small { font-family:var(--mono); font-size:10.5px; letter-spacing:0; color:var(--muted); }
  .dh em { width:10px; text-align:center; opacity:.6; font-style:normal; }
  .dh .err { color:var(--accent); text-transform:none; letter-spacing:0; }
  .dl { display:flex; align-items:baseline; gap:8px; padding:6px 16px 6px 12px; font-size:14px; color:var(--muted); cursor:pointer; position:relative; text-decoration:none; }
  .dl:hover, .dl.on { color:var(--fg); }
  .dl.on::before { content:''; position:absolute; left:0; top:8px; bottom:8px; width:2px; background:var(--c, var(--accent)); }
  .dl span { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .dl small { font-family:var(--mono); font-size:11px; color:var(--muted); }
  .dl.add { margin-top:18px; padding-left:0; font-size:13px; }
  .main { flex:1; min-width:0; overflow:auto; scrollbar-width:none; }
  .col { max-width:920px; margin:0 auto; padding:30px 32px 80px; box-sizing:border-box; }

  /* Shared bits */
  h1 { margin:16px 0 14px; font-size:28px; font-weight:200; letter-spacing:-.01em; line-height:1.25; text-wrap:balance; }
  .back { border:0; background:none; padding:0; cursor:pointer; font-size:13px; color:var(--muted); }
  .back:hover { color:var(--fg); }
  .pill { display:inline-flex; align-items:center; flex-shrink:0; padding:var(--pill-pad); border-radius:var(--rp); font-size:11px; font-weight:500;
          letter-spacing:.01em; line-height:1.5; color:var(--c); box-shadow:inset 2px 0 0 var(--c); }
  body.modern .pill { background:var(--c); color:#111; box-shadow:none; }
  .btn { border:0; background:var(--btn-bg); color:var(--btn-fg); box-shadow:var(--btn-ul); cursor:pointer; padding:8px 16px; border-radius:var(--r2); font-size:13px; }
  .btn2 { border:var(--b2-bd); background:var(--b2-bg); color:var(--fg); cursor:pointer; padding:6px 12px; border-radius:var(--r2); font-size:12.5px;
          display:inline-flex; align-items:center; gap:7px; white-space:nowrap; }
  .btn2:hover { color:var(--accent); }
  .btn2.quiet { color:var(--muted); }
  .btn2.quiet:hover { color:var(--fg); }
  .link { border:0; background:none; cursor:pointer; padding:0; font-size:13px; color:var(--muted); }
  .link:hover { color:var(--fg); }
  .link.u { color:var(--fg); border-bottom:1px solid var(--accent); }
  .empty { padding:80px 30px; text-align:center; color:var(--muted); font-size:14px; line-height:1.7; }

  /* Today */
  .home { max-width:860px; margin:0 auto; padding:28px 32px 0; min-height:100%; box-sizing:border-box; display:flex; flex-direction:column; }
  .meta { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .meta .glow { width:6px; height:6px; border-radius:50%; background:var(--accent); box-shadow:0 0 10px var(--accent); }
  .meta .glow.pulse { animation:pulse 1.4s ease-in-out infinite; }
  .home h1 { margin:12px 0 0; font-size:32px; line-height:1.15; letter-spacing:-.02em; }
  .home .lead { margin:10px 0 0; font-size:16px; line-height:1.6; opacity:.85; text-wrap:pretty; }
  .qhead { display:flex; align-items:center; gap:14px; margin:24px 0 10px; }
  .bars { display:flex; gap:3px; }
  .bars i { width:18px; height:3px; border-radius:2px; background:var(--line); }
  .bars i.on { background:var(--accent); }
  .q { display:grid; grid-template-columns:34px minmax(0,1fr) auto; gap:4px 14px; align-items:baseline; padding:16px 16px 16px 14px; border-radius:var(--r); cursor:pointer; margin-bottom:2px; }
  .q:hover, .q.sel { background:var(--faint); }
  .q .n { font-family:var(--mono); font-size:12px; color:var(--muted); }
  .q .n.first { color:var(--accent); }
  .q .who { display:flex; align-items:center; gap:10px; font-size:15px; font-weight:400; min-width:0; }
  .q .who span { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .q .why { font-size:14px; line-height:1.5; color:var(--muted); margin-top:4px; text-wrap:pretty; }
  .q.done { opacity:.55; }
  .q.done .who span { text-decoration:line-through; text-decoration-color:var(--muted); }
  .q .side { display:flex; align-items:center; gap:12px; }
  .q .due { font-family:var(--mono); font-size:11px; color:var(--muted); white-space:nowrap; }
  .q .due.now, .q.done .due { color:var(--accent); }
  .raise { width:26px; height:26px; border:1px solid var(--line); border-radius:50%; background:transparent; cursor:pointer; color:var(--muted);
           display:flex; align-items:center; justify-content:center; padding:0; }
  .raise:hover { border-color:var(--accent); color:var(--accent); }
  .raise.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  .tick { width:26px; height:26px; border:1px solid var(--line); border-radius:50%; background:transparent; cursor:pointer; color:var(--muted);
          display:flex; align-items:center; justify-content:center; padding:0; }
  .tick:hover { border-color:var(--accent); }
  .q.done .tick { background:var(--accent); border-color:var(--accent); color:#fff; }
  .ready { display:inline-flex; align-items:center; gap:8px; margin-top:10px; border:var(--bd); background:var(--sheet); border-radius:var(--rp); padding:5px 12px;
           cursor:pointer; font-size:12.5px; color:var(--fg); }
  body:not(.modern) .ready { padding:5px 0; background:none; }
  .ready:hover { border-color:var(--accent); color:var(--accent); }
  .ready i { width:5px; height:5px; border-radius:50%; background:var(--accent); }
  .aside { margin:22px 0 0 14px; border:0; background:none; padding:0; cursor:pointer; text-align:left; font-size:13.5px; line-height:1.6; color:var(--muted); }
  .aside:hover { color:var(--fg); }
  .log { display:flex; flex-direction:column; gap:22px; margin-top:40px; }
  .log .asked { font-size:14px; color:var(--muted); margin-bottom:8px; }
  .log .ans { display:flex; gap:14px; }
  .log .ans > i { width:2px; background:var(--accent); flex-shrink:0; }
  .log .txt { font-size:15.5px; line-height:1.6; white-space:pre-wrap; overflow-wrap:anywhere; }
  .log .txt.wait { color:var(--muted); }
  .log pre { margin:12px 0 0; padding:12px 14px; background:var(--faint); border-radius:var(--r); font:inherit; font-size:14.5px; line-height:1.6; white-space:pre-wrap; overflow-wrap:anywhere; }
  .log ul { margin:12px 0 0; padding:0; list-style:none; font-size:13.5px; color:var(--muted); }
  .log li { padding:3px 0; }
  .log li b { color:var(--fg); font-weight:400; }
  .log .go { display:flex; gap:18px; margin-top:12px; align-items:center; }
  .askbox { position:sticky; bottom:0; padding:4px 0 14px; background:var(--bg); margin-top:auto; }
  .askbox::before { content:''; position:absolute; left:0; right:0; top:-24px; height:24px; background:linear-gradient(transparent, var(--bg)); pointer-events:none; }
  .sugg { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
  .sugg button { border:var(--bd); background:none; border-radius:var(--rp); padding:4px 11px; font-size:12px; color:var(--muted); cursor:pointer; }
  body:not(.modern) .sugg button { padding:4px 0; margin-right:14px; }
  .sugg button:hover { color:var(--fg); border-color:var(--fg); }
  .ask { border:var(--bd); border-radius:var(--r); background:var(--sheet); box-shadow:var(--ask-sh); }
  .ask .row { display:flex; gap:12px; align-items:flex-start; padding:12px 16px 2px; }
  .ask textarea { flex:1; border:0; outline:none; resize:none; background:none; color:var(--fg); font-size:16px; font-weight:300; line-height:1.5; height:24px; max-height:160px;
                  padding:3px 0; caret-color:var(--accent); overflow:hidden; }
  .ask .go { width:34px; height:34px; flex-shrink:0; border:0; border-radius:var(--rp); background:var(--btn-bg); color:var(--send-fg); cursor:pointer;
             display:flex; align-items:center; justify-content:center; padding:0; }
  .ask .opts { display:flex; align-items:center; gap:6px; flex-wrap:wrap; padding:0 10px 6px; }
  .prov { border:0; border-radius:var(--r2); padding:4px 9px; cursor:pointer; font-family:var(--mono); font-size:11px; background:transparent; color:var(--muted); }
  .prov:hover { color:var(--fg); }
  .prov.on { background:var(--faint); color:var(--fg); }
  .sw { display:flex; align-items:center; gap:8px; border:0; background:none; cursor:pointer; font-size:12px; color:var(--muted); padding:4px 6px; }
  .sw:hover { color:var(--fg); }
  .sw i { width:24px; height:14px; border-radius:var(--rp); background:var(--line); position:relative; display:inline-block; }
  body:not(.modern) .sw i { border-radius:7px; }
  .sw i::after { content:''; position:absolute; top:2px; left:2px; width:10px; height:10px; border-radius:50%; background:var(--bg); transition:left .15s; }
  .sw.on i { background:var(--accent); }
  .sw.on i::after { left:12px; }

  /* Calm down */
  .calm { margin-top:16px; border:var(--bd); border-radius:var(--r); background:var(--sheet); box-shadow:0 24px 60px -30px var(--glow); }
  body:not(.modern) .calm { box-shadow:inset 2px 0 0 var(--accent); background:var(--faint); }
  .calm .hd { padding:16px 18px 6px; }
  .calm .hd b { display:block; font-size:16px; font-weight:400; }
  .calm .hd p { font-size:13px; color:var(--muted); margin:3px 0 0; }
  .cr { display:flex; align-items:center; gap:14px; padding:10px 18px; cursor:pointer; }
  .cr:hover, .cr.peek { background:var(--faint); }
  .box { width:18px; height:18px; flex-shrink:0; border-radius:5px; border:1px solid var(--line); display:flex; align-items:center; justify-content:center; color:#fff; }
  body:not(.modern) .box { border-radius:0; }
  .box.on { background:var(--accent); border-color:var(--accent); }
  .box svg { visibility:hidden; }
  .box.on svg { visibility:visible; }
  .cr .t { flex:1; min-width:0; }
  .cr .w { display:flex; align-items:center; gap:10px; font-size:14px; font-weight:400; }
  .cr .w span { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cr .y { font-size:13px; color:var(--muted); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cr .k { font-family:var(--mono); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }
  .cr em { width:12px; font-size:12px; color:var(--muted); text-align:center; font-style:normal; }
  .peekb { margin:0 18px 8px 50px; padding:12px 14px; background:var(--faint); border-radius:var(--r); }
  .peekb .s { display:flex; gap:12px; align-items:baseline; font-size:13px; color:var(--muted); margin-bottom:6px; }
  .peekb .s b { color:var(--fg); font-weight:400; }
  .peekb .x { font-size:14px; line-height:1.6; white-space:pre-wrap; overflow-wrap:anywhere; max-height:140px; overflow:auto; }
  .peekb .go { display:flex; gap:16px; margin-top:10px; }
  .calm .ft { display:flex; align-items:center; gap:14px; padding:12px 18px 16px; }

  /* Folder */
  .fhead { display:flex; align-items:baseline; gap:20px; margin:18px 0; }
  .fhead h1 { margin:0; }
  .fhead input { flex:1; border:0; outline:none; background:none; font-size:14px; font-weight:300; color:var(--fg); caret-color:var(--accent); text-align:right; }
  .grp { display:flex; align-items:center; gap:12px; padding:22px 14px 6px; }
  .grp small { font-size:10.5px; opacity:.7; }
  .grp i { flex:1; height:1px; background:var(--line); }
  .it { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:3px 16px; padding:14px; border-radius:var(--r); cursor:pointer; }
  .it:hover, .it.sel { background:var(--faint); }
  .it .w { display:flex; align-items:center; gap:10px; font-size:14.5px; min-width:0; }
  .it.unseen .w { font-weight:500; }
  .it .w > i { width:6px; height:6px; border-radius:50%; background:var(--accent); flex-shrink:0; }
  .it .w span { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .it .d { font-family:var(--mono); font-size:11px; color:var(--muted); white-space:nowrap; }
  .it .p { grid-column:1 / -1; font-size:13.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .it .p b { color:var(--fg); font-weight:300; }

  /* Letter */
  .acts { display:flex; align-items:center; gap:2px; position:sticky; top:0; z-index:4; background:var(--bg); margin:-30px -12px 0; padding:22px 12px 8px; }
  .acts .lnav { display:inline-flex; align-items:center; gap:0; margin-left:6px; }
  .acts .lnav .ib:disabled { opacity:.3; cursor:default; background:none; }
  .acts .done { display:inline-flex; align-items:center; gap:6px; border:0; background:none; cursor:pointer; padding:6px 10px; font-size:13px; color:var(--fg); box-shadow:inset 0 -1.5px 0 var(--accent); margin-right:6px; }
  body.modern .acts .done { background:var(--accent); color:#fff; box-shadow:none; border-radius:var(--r2); }
  .acts .done.prio { color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent); border-radius:var(--r2); margin-left:4px; }
  .acts .done.prio:hover { background:var(--accent); color:#fff; }
  .acts .done.prio.on { background:var(--accent); color:#fff; }
  .acts .done.quiet { color:var(--muted); box-shadow:none; background:none; }
  .acts .done.quiet:hover { color:var(--fg); }
  .notebox { margin:14px 0 6px; padding:14px 16px; background:var(--faint); border-radius:var(--r); }
  .notebox small { display:block; color:var(--muted); font-size:12.5px; margin-bottom:8px; }
  .notebox textarea { width:100%; box-sizing:border-box; min-height:64px; border:0; background:none; color:var(--fg); font:inherit; font-size:14.5px; line-height:1.55;
                      outline:none; resize:vertical; caret-color:var(--accent); padding:0; }
  .notebox .go { display:flex; gap:16px; align-items:center; margin-top:8px; }
  .toast.act { pointer-events:auto; display:flex; gap:16px; align-items:center; }
  .toast button { border:0; background:none; color:inherit; cursor:pointer; padding:0; font-size:13px; box-shadow:inset 0 -1px 0 var(--accent); }
  .lmeta { display:flex; gap:12px; align-items:center; flex-wrap:wrap; font-size:14px; color:var(--muted); margin-bottom:26px; }
  .lmeta b { color:var(--fg); font-weight:400; }
  .lmeta .when { font-family:var(--mono); font-size:11px; }
  .note { display:flex; gap:14px; align-items:flex-start; margin:0 0 28px; padding:16px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
  .note > span { color:var(--muted); display:flex; padding-top:1px; }
  .note p { margin:6px 0 0; font-size:15.5px; line-height:1.55; text-wrap:pretty; }
  .text b { font-weight:500; }
  .text { font-size:15.5px; line-height:1.7; white-space:pre-wrap; overflow-wrap:anywhere; }

  <div class="seg" id="focus" hidden></div>
  <div class="r">
    <button class="ib" id="bFind" title="Find letters (Cmd+F)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="11" cy="11" r="6"/><path d="M16 16l4 4"/></svg></button>
    <button class="ib" id="bRefresh" title="Get mail now (Cmd+R)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M19 12a7 7 0 1 1-2.05-4.95"/><path d="M19 5v4h-4"/></svg></button>
    <button class="calmb" id="bCalm" title="Calm down: mark letters that don't need you as read"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3 10c3-3 6-3 9 0s6 3 9 0M3 16c3-3 6-3 9 0s6 3 9 0"/></svg><span class="lbl" id="calmLbl">Calm down</span><b id="calmN" hidden></b></button>
    <button class="ib" id="bSettings" title="Settings"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button>
    <button class="ib write" id="bWrite" title="New letter (Cmd+N)"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M5 19l2.5-.5L18 8l-2-2L5.5 16.5z"/><path d="M14 8l2 2" stroke="var(--accent)"/></svg></button>
  </div>
</div>
<div class="body">
  <div class="drawer"><div id="drawer"></div></div>
  <div class="main" id="main"></div>
</div>
<input type="file" id="fileIn" multiple hidden>
<div class="toast" id="toast"></div>
<script>
  const $ = (id) => document.getElementById(id);
  const send = (m) => window.webkit.messageHandlers.mail.postMessage(JSON.stringify(m));
  const esc = (t) => String(t ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const store = { get: (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
                  set: (k, v) => localStorage.setItem(k, JSON.stringify(v)) };
  if (new URLSearchParams(location.search).get('theme') === 'night') document.body.classList.add('night');
  if (store.get('tegamiLook', 'kuhaku') === 'modern') document.body.classList.add('modern');
  if (store.get('tegamiDrawer', false)) document.body.classList.add('dopen');

  const IC = {
    pen: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 19l2.5-.5L18 8l-2-2L5.5 16.5z"/><path d="M14 8l2 2"/></svg>',
    up2: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 19V6M6 11l6-6 6 6"/></svg>',
    clock: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>',
    spark: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M12 4v16M4 12h16M6.3 17.7L17.7 6.3M6.3 6.3l11.4 11.4"/></svg>',
    tick: (w = 13, s = 1.6) => `<svg width="${w}" height="${w}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${s}"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`,
    reply: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M10 7l-5 5 5 5M5 12h9a5 5 0 0 1 5 5"/></svg>',
    replyAll: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M12 7l-5 5 5 5M7 7l-5 5 5 5M7 12h7a5 5 0 0 1 5 5"/></svg>',
    fwd: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M14 7l5 5-5 5M19 12h-9a5 5 0 0 0-5 5"/></svg>',
    done: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="12" cy="12" r="8"/><path d="M8.5 12.2l2.4 2.4 4.6-4.8"/></svg>',
    spam: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="12" cy="12" r="8"/><path d="M6.5 17.5l11-11"/></svg>',
    trash: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12"/></svg>',
    again: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M19 12a7 7 0 1 1-2.1-5M19 4v4h-4"/></svg>',
    clip: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M8 12.5l5.5-5.5a2.5 2.5 0 0 1 3.5 3.5L10 17.5a4 4 0 0 1-5.5-5.5L11 5.5"/></svg>',
    up: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 19V5M6 11l6-6 6 6"/></svg>',
  };
  const SWATCHES = ['oklch(0.72 0.11 250)', 'oklch(0.75 0.12 155)', 'oklch(0.78 0.12 75)', 'oklch(0.68 0.16 30)', 'oklch(0.7 0.14 330)', 'oklch(0.72 0.12 200)', 'oklch(0.7 0.02 260)'];
  const WORDS = ['No', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine'];
  const FOLDERS = [['inbox', 'Inbox'], ['invitations', 'Invitations'], ['notifications', 'Notifications'], ['later', 'Later'], ['done', 'Done'], ['drafts', 'Drafts'], ['sent', 'Sent'], ['outbox', 'Outbox'], ['spam', 'Spam']];
  const groupOf = new Map();       // a row's key → the letters of its conversation, for ticks and the right-click menu
  const KIND = { purchases: 'Purchase', updates: 'Update', newsletters: 'Newsletter', cold: 'Offer', important: 'Letter' };
  const SECS = [['reply', 'Waiting for your answer'], ['todo', 'To do'], ['read', 'Worth reading'], ['important', 'Letters'], ['purchases', 'Purchases'],
                ['updates', 'Updates'], ['newsletters', 'Newsletters'], ['cold', 'Offers'], ['other', 'Other']];
  const ATT = { reply: 'Waiting for your answer', todo: 'To do', read: 'Worth reading' };
  const joinAnd = (a) => a.length < 2 ? a.join('') : a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1];

  // What Tegami knows ---------------------------------------------------------------------------
  let accts = [], counts = {}, status = { online: true, waiting: 0 }, errors = {}, brief = null, providers = [], imagesMode = 'false';
  let today = [], calm = [], items = [], cur = null, log = [];
  let focus = store.get('tegamiFocus', 'all'), act = store.get('tegamiAct', false);
  let view = { name: 'home' }, from = 'home', sel = -1;
  let calmOpen = false, calmOff = new Set(), calmPeek = null;
  const doneHere = new Map();      // letters done while Tegami is open: gone from Today at once, before the backend says so
  let order = [];                  // the order Today first showed its letters in
  let comp = null;                 // the letter being written
  let ui = { open: store.get('tegamiOpen', {}), colorOpen: null, voice: false, sure: null, token: 0 };

  function toast(t, undo) {
    const el = $('toast'); el.textContent = t; el.classList.toggle('act', !!undo);
    if (undo) { const b = document.createElement('button'); b.textContent = 'Undo'; b.onclick = () => { el.classList.remove('show', 'act'); undo(); }; el.appendChild(b); }
    el.classList.add('show'); clearTimeout(el._h); el._h = setTimeout(() => el.classList.remove('show', 'act'), undo ? 5000 : 2400);
  }
  window.toast = toast;
  const day = (ts) => {
    const d = new Date(ts * 1000), now = new Date();
    if (d.toDateString() === now.toDateString()) return d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
    const y = new Date(now); y.setDate(now.getDate() - 1);
    if (d.toDateString() === y.toDateString()) return 'Yesterday';
    return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: d.getFullYear() !== now.getFullYear() ? 'numeric' : undefined });
  };
  const full = (ts) => new Date(ts * 1000).toLocaleString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  const dueText = (d) => {
    if (!d) return '';
    const t = new Date(d + 'T12:00'); if (isNaN(t)) return '';
    const days = Math.round((t - new Date().setHours(12, 0, 0, 0)) / 864e5);
    return days < 0 ? 'Overdue' : days === 0 ? 'Today' : days === 1 ? 'Tomorrow' : t.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
  };
  const acct = (id) => accts.find((a) => a.id === id) || {};
  const label = (id) => acct(id).label || acct(id).name || acct(id).email || '';
  const color = (id) => acct(id).color || SWATCHES[Math.max(0, accts.findIndex((a) => a.id === id)) % SWATCHES.length];
  const pill = (id) => accts.length > 1 && focus === 'all' && id ? `<span class="pill" style="--c:${color(id)}">${esc(label(id))}</span>` : '';
  const inFocus = (m) => focus === 'all' || m.acct === focus;
  const provName = () => { const p = providers.find((x) => x.on) || {}; return p.short || p.label || 'Claude'; };
  const isNew = () => view.name === 'new';

  // From the backend ----------------------------------------------------------------------------
  window.accounts = (a) => {
    accts = a;
    if (focus !== 'all' && !accts.some((x) => x.id === focus)) focus = 'all';
    drawBar(); drawDrawer();
    if (!a.length) return go({ name: 'add' });
    send({ type: 'brief' }); send({ type: 'providers' }); send({ type: 'contacts' }); send({ type: 'languages' }); send({ type: 'status' }); refreshLists();
    if (view.name === 'settings') draw(); else if (view.name === 'add' && a.length && !view.adding) go({ name: 'home' });
  };
  function refreshLists() {
    send({ type: 'list', acct: 'all', folder: 'today', q: '' });
    send({ type: 'calm' });
    if (view.name === 'folder') askFolder();
  }
  function askFolder() { send({ type: 'list', acct: view.acct, folder: view.folder, q: (view.q || '').trim() }); }
  window.listed = (d) => {
    if (d.counts) { counts = d.counts; drawDrawer(); }
    if (d.folder === 'today') {
      today = d.items;
      today.forEach((m) => { if (!order.includes(m.key)) order.push(m.key); });
      if (view.name === 'home') { draw(); if (restoreTo != null) { $('main').scrollTop = restoreTo; restoreTo = null; } }
      return;
    }
    if (view.name !== 'folder' || d.folder !== view.folder || d.acct !== view.acct) return;
    items = d.items; drawFolderList();
    if (restoreTo != null) { $('main').scrollTop = restoreTo; restoreTo = null; }
  };
  window.calmList = (list) => { calm = list; drawBar(); if (view.name === 'home') draw(); };
  window.providersAre = (list) => { providers = list; if (view.name === 'home' || view.name === 'settings') draw(); };
  window.imagesAllIs = (mode) => { imagesMode = mode === true ? 'true' : mode === false ? 'false' : mode; if (view.name === 'settings') draw(); };
  window.fromMail = ({ kind, data }) => {
    if (kind === 'status') { status = data; drawBar(); drawDrawer(); }
    if (kind === 'account') { errors[data.id] = data.error; drawDrawer(); if (view.name === 'settings') draw(); }
    if (kind === 'assistant') { brief = data; drawBar(); if (view.name === 'home' || view.name === 'settings') draw(); }
    if (kind === 'changed') refreshLists();
    if (kind === 'sent') { toast('Sent'); send({ type: 'status' }); }
  };

  // The bar and the drawer --------------------------------------------------------------------
  function drawBar() {
    const busy = !!(status.busy || (brief && brief.busy));
    $('barLine').classList.toggle('pulse', busy);
    $('state').textContent = [status.online === false ? 'Offline' : '', status.waiting ? `${status.waiting} waiting to send` : '',
      brief && brief.busy ? `${provName()} is reading new letters` : ''].filter(Boolean).join(' · ');
    const f = $('focus');
    f.hidden = accts.length < 2;
    f.innerHTML = [{ id: 'all', label: 'All' }, ...accts.map((a) => ({ id: a.id, label: label(a.id), c: color(a.id) }))].map((o) =>
      `<button data-focus="${o.id}" class="${focus === o.id ? 'on' : ''}">${o.c ? `<i style="background:${o.c}"></i>` : ''}${esc(o.label)}</button>`).join('');
    const n = calm.filter(inFocus).length;
    $('calmN').hidden = !n; $('calmN').textContent = n;
    $('calmLbl').textContent = n ? 'Calm down' : 'All calm';
    $('bCalm').classList.toggle('on', calmOpen && view.name === 'home');
  }
  $('focus').onclick = (e) => {
    const b = e.target.closest('[data-focus]'); if (!b) return;
    focus = b.dataset.focus; store.set('tegamiFocus', focus);
    drawBar(); drawDrawer();
    if (view.name === 'folder' || view.name === 'letter') go({ name: 'home' }); else draw();
  };
  function drawDrawer() {
    const boxes = [{ id: 'all', label: 'All mailboxes' }, ...accts.map((a) => ({ id: a.id, label: label(a.id), c: color(a.id) }))]
      .filter((b) => accts.length > 1 ? (focus === 'all' || b.id === focus || b.id === 'all') : b.id !== 'all');
    const by = counts.byAcct || {};
    let h = '';
    boxes.forEach((b, i) => {
      const unread = b.id === 'all' ? (counts.inbox || 0) : ((by[b.id] || {}).inbox || 0);
      const here = view.name === 'folder' && view.acct === b.id;
      const open = ui.open[b.id] ?? (here || i === 0);
      h += `<div class="dh" data-fold="${b.id}" style="${b.c ? 'color:' + b.c : ''}"><i style="background:${b.c || 'var(--fg)'}"></i><span>${esc(b.label)}${errors[b.id] ? ` <span class="err">· ${esc(errors[b.id])}</span>` : ''}</span>` +
           `<small>${open ? '' : unread || ''}</small><em>${open ? '–' : '+'}</em></div>`;
      if (!open) return;
      const own = b.id === 'all' ? [] : ((counts.folders || {})[b.id] || []).map((f) => ['f:' + f, f]);
      [...FOLDERS, ...own].forEach(([f, name]) => {
        if ((f === 'notifications' || f === 'invitations') && b.id !== 'all' && accts.length > 1) return;
        const n = f === 'inbox' ? unread : f === 'notifications' ? counts.notifications : f === 'invitations' ? counts.invitations : f === 'spam' ? (b.id === 'all' ? counts.spam : (by[b.id] || {}).spam) : f === 'outbox' ? status.waiting : 0;
        h += `<a class="dl${here && view.folder === f ? ' on' : ''}" style="--c:${b.c || 'var(--accent)'}" data-acct="${b.id}" data-folder="${esc(f)}"><span>${esc(name)}</span><small>${n || ''}</small></a>`;
      });
    });
    h += '<a class="dl add" data-add="1"><span>Add a mailbox</span></a>';
    $('drawer').innerHTML = h;
  }
  $('drawer').onclick = (e) => {
    const f = e.target.closest('[data-fold]');
    if (f) { const id = f.dataset.fold, here = view.name === 'folder' && view.acct === id;
             const open = ui.open[id] ?? (here || f === $('drawer').querySelector('[data-fold]'));
             ui.open[id] = !open; store.set('tegamiOpen', ui.open); return drawDrawer(); }
    const a = e.target.closest('a'); if (!a) return;
    if (a.dataset.add) return go({ name: 'add', adding: true });
    go({ name: 'folder', acct: a.dataset.acct, folder: a.dataset.folder, q: '' });
  };
  function toggleDrawer(on) {
    document.body.classList.toggle('dopen', on ?? !document.body.classList.contains('dopen'));
    store.set('tegamiDrawer', document.body.classList.contains('dopen'));
  }
  $('bDrawer').onclick = () => toggleDrawer();

  // Moving between views ----------------------------------------------------------------------
  function go(v) {
    if (v.name !== 'letter') cur = null;
    if (v.name !== 'letter' && v.name !== 'new') { if (comp) { saveDraft(true); if (comp.saved) toast('Saved in Drafts'); } comp = null; }
    const keep = v.scroll != null;          // coming back from a letter: same list, same place
    view = v; sel = keep && v.sel != null ? v.sel : -1;
    if (v.name === 'folder') { if (!keep) items = []; askFolder(); }
    if (v.name === 'settings') send({ type: 'imagesAll?' });
    draw(); drawBar(); drawDrawer();
    $('main').scrollTop = keep ? v.scroll : 0;
    restoreTo = keep ? v.scroll : null;
    delete v.scroll;
  }
  function draw() {
    const a = document.activeElement, id = a && a.id && $('main').contains(a) ? a.id : '';
    const pos = id && 'selectionStart' in a ? [a.selectionStart, a.selectionEnd] : null;
    paint();
    const b = id && $(id);
    if (b && b !== document.activeElement) { b.focus(); if (pos) try { b.setSelectionRange(...pos); } catch (e) {} }
  }
  function paint() {
    const v = view.name;
    if (v === 'home') return drawHome();
    if (v === 'folder') return drawFolder();
    if (v === 'letter') return drawLetter();
    if (v === 'new') return drawNew();
    if (v === 'settings') return drawSettings();
    if (v === 'add') return drawAdd();
    if (v === 'gmail') return drawGmail();
    if (v === 'other') return drawOther();
  }

  // Today -------------------------------------------------------------------------------------
  function queue() {
    // The backend's order (the owner's moves first). Done letters leave Today and wait in Done.
    return today.filter(inFocus).filter((m) => !doneHere.has(m.key));
  }
  function drawHome() {
    if (!accts.length) return go({ name: 'add' });
    const b = brief || {}, on = b.enabled !== false;
    const q = on ? queue() : [];
    const need = q, doneL = [...doneHere.values()].filter((d) => d.m && inFocus(d.m)).map((d) => d.m);
    const where = focus === 'all' || accts.length < 2 ? '' : ` in ${label(focus)}`;
    let title, lead;
    if (!on) { title = 'The assistant is not reading new letters.'; lead = 'Your letters are in the folders behind the menu, top left.'; }
    else if (b.busy && !q.length) { title = 'Reading your new letters…'; lead = ''; }
    else if (need.length) {
      title = `${WORDS[need.length] || need.length} letter${need.length > 1 ? 's' : ''} need${need.length > 1 ? '' : 's'} you today${where}.`;
      const say = (m) => { const d = dueText(m.due); return esc(m.who) + (d === 'Overdue' ? ', overdue' : d === 'Today' ? ', today' : d ? `, by ${d}` : ''); };
      const [f, ...rest] = need;
      lead = `Start with ${say(f)}.` + (rest.length ? ` Then ${joinAnd(rest.slice(0, 4).map(say))}${rest.length > 4 ? ` and ${rest.length - 4} more` : ''}.` : '');
    } else {
      title = `Nothing needs you today${where}.`;
      lead = doneL.length ? `You dealt with ${WORDS[doneL.length] ? WORDS[doneL.length].toLowerCase() : doneL.length} letter${doneL.length > 1 ? 's' : ''} today. A clean space.` : 'Everything is answered.';
    }
    const date = new Date().toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
    const meta = [date, b.busy ? `${provName()} is reading new letters` : on && b.read ? `${provName()} read ${b.read} letter${b.read === 1 ? '' : 's'} since yesterday` : '',
      b.waiting && !b.busy && on ? `${b.waiting} still to read` : ''].filter(Boolean).join(' · ');
    const first = need[0] && need[0].key;
    const fq = hs.open ? hs.q.trim().toLowerCase() : '';
    const shown = fq && hs.scope === 'important' ? q.filter((m) => [m.who, m.subject, m.summary, m.addr].join(' ').toLowerCase().includes(fq)) : q;
    const rows = shown.map((m, i) => {
      groupOf.set(m.key, { keys: m.keys || [m.key], pri: m.pri || 0, done: false, today: true });
      const d = null, due = dueText(m.due) || (m.urgent ? 'Today' : '');
      return `<div class="q" data-open="${esc(m.key)}"><span class="n${m.key === first ? ' first' : ''}">${String(i + 1).padStart(2, '0')}</span>
        <div style="min-width:0"><div class="who"><span>${esc(m.who)}</span>${m.count > 1 ? `<span class="cnt">${m.count} letters</span>` : ''}${pill(m.acct)}${m.pri > 0 && !d ? '<span class="pin">Top</span>' : ''}</div>
          <div class="why">${esc(m.summary || m.subject)}</div>
          ${!d && m.drafted ? `<button class="ready" data-draft="${esc(m.key)}" title="Opens the letter with the reply written in your voice; you check and send"><i></i>Reply ready · open it</button>` : ''}</div>
        <div class="side"><span class="due${!d && (due === 'Overdue' || due === 'Today' || m.urgent) ? ' now' : ''}">${esc(due)}</span>
          <button class="raise${m.pri > 0 ? ' on' : ''}" data-raise="${esc(m.key)}" title="${m.pri > 0 ? 'Raised: click to put it back in the assistant\'s order' : 'More important: to the top (the assistant learns from it)'}">${IC.up2}</button>
          <button class="tick" data-tick="${esc(m.key)}" title="Done">${IC.tick()}</button></div></div>`;
    }).join('');
    // Set aside: who wrote what the assistant let be.
    const quiet = calm.filter(inFocus);
    let aside = '';
    if (on && quiet.length) {
      const names = [...new Set(quiet.map((m) => m.who))];
      aside = `Set aside: ${esc(joinAnd(names.length > 5 ? [...names.slice(0, 4), `${names.length - 4} more`] : names))}. Nothing there needs you.`;
    }
    if (b.error && on) aside += (aside ? ' ' : '') + `Last time the assistant could not finish: ${esc(b.error)}`;
    const sugg = suggestions(need);
    $('main').innerHTML = `<div class="home">
      <div class="meta mono"><span class="glow${b.busy ? ' pulse' : ''}"></span><span>${esc(meta)}</span></div>
      ${calmOpen && quiet.length ? calmCard(quiet) : ''}
      ${hs.open ? findBar() : ''}
      <h1>${title}</h1>${lead ? `<p class="lead">${lead}</p>` : ''}
      ${!on ? '<p style="margin-top:22px"><button class="btn" data-assistant="1">Let the assistant read new letters</button></p>' : ''}
      ${hs.open && hs.scope === 'all' ? findAll() : q.length ? `<div class="qhead mono"><span>${fq ? `${shown.length} of ${q.length} match` : 'Read in this order'}</span><span class="grow"></span>
        <button class="link mono" data-donelist="1" style="font-size:11px">${doneL.length ? `${doneL.length} done · ` : ''}Done →</button></div><div>${rows || `<div class="empty" style="padding:30px 0">Nothing on Today matches. <button class="link u" data-scope="all">Look in All inbox</button></div>`}</div>` : ''}
      ${!hs.open && counts.invitations ? `<button class="aside" data-invites="1">${counts.invitations} invitation${counts.invitations > 1 ? 's wait' : ' waits'} for your answer.</button>` : ''}

  function letterAct(a) {
    const m = cur;
    if (a === 'answer') a = replyMode(m);

        startComp(a, '', '', comp.tmsg); Object.assign(comp, keep); } else startComp(a);

      const how = t.pri > 0 ? 'normal' : 'up';
      send({ type: 'pri', keys: t.keys || [t.key], how }); t.pri = how === 'up' ? Date.now() / 1000 : 0;

  const at8 = (d) => { d.setHours(8, 0, 0, 0); return d; };

    ['eve', 'This evening', () => { const d = new Date(); d.setHours(18, 0, 0, 0); return d < new Date() ? null : d; }],

    toast(`Later: back on Today ${whenText(until)}`, () => { send({ type: 'later', keys, until: 0 }); doneHere.delete(key); draw(); toast('Back on Today'); });
  }
  // After Done or Send (Settings): the next letter, back to the list, or stay.
  const AFTER = [['next', 'Next letter', 'Opens the next letter in the list'], ['list', 'Back to the list'], ['stay', 'Stay on the letter']];
  // The letters of the list you came from, in its order (one per conversation).
  function listKeys() {
    return from.name === 'folder' ? [...new Set(items.map((m) => m.thread || m.key))].map((t) => (items.find((m) => (m.thread || m.key) === t) || {}).key)
      : queue().map((m) => m.key);
  }
  function listPos(m) {
    const keys = listKeys(), mine = [m.key, ...(m.thread || []).map((x) => x.key)];
    return [keys, keys.findIndex((k) => mine.includes(k))];
  }
  function step(d) {
    if (!cur) return;
    const [keys, i] = listPos(cur);
    const k = keys[i < 0 ? 0 : i + d];
    if (!k) return toast(d > 0 ? 'That was the last one' : 'That was the first one');
    if (comp) saveDraft(true);
    const f = from; openLetter(k); from = f;
  }
  function neighbour(key) {
    const keys = listKeys();
    const i = keys.indexOf(key);
    return i < 0 ? keys[0] : keys[i + 1] || keys[i - 1] || null;
  }
  function afterLetter(key) {
    const how = store.get('tegamiAfter', 'next');
    if (how === 'stay') return drawLetter();
    const next = how === 'next' ? neighbour(key) : null;
    if (next && next !== key) { const f = from; openLetter(next); from = f; return; }
    back();
  }
  function markDone(key, keys, item, note, verdict) {
    const inLetter = view.name === 'letter' && cur && keys.includes(cur.key);
    const next = inLetter && store.get('tegamiAfter', 'next') === 'next' ? neighbour(key) : null;
    send({ type: 'done', keys, done: true, ...(note != null ? { note, verdict } : {}) });
    if (item) doneHere.set(key, { m: item, how: 'done' });
    if (cur && cur.ai && keys.includes(cur.key)) cur.ai.done = true;
    if (inLetter) {
      if (store.get('tegamiAfter', 'next') === 'stay') drawLetter();
      else if (next && next !== key) { const f = from; openLetter(next); from = f; }
      else back();
    } else draw();
    toast(note ? 'Done. The assistant will remember your note.' : keys.length > 1 ? `Done: ${keys.length} letters` : 'Done', () => markUndone(key, keys));
  }
  // Important: the letter comes to Today at the top, and the assistant learns that letters like it matter.
  function markImportant(key, keys) {
    send({ type: 'important', keys });
    hs.items.forEach((x) => { if (keys.includes(x.key)) { x.attention = 'todo'; x.done = false; } });
    doneHere.delete(key);
    if (cur && cur.ai && keys.includes(cur.key)) cur.ai.done = false;
    draw(); toast('Important: it is on Today now. The assistant will learn from it.');
  }
  function markUndone(key, keys) {
    send({ type: 'done', keys, done: false }); doneHere.delete(key);
    if (cur && cur.ai && keys.includes(cur.key)) cur.ai.done = false;
    draw(); toast('Back on Today');
  }

  // Right click: done, done with a note (which teaches the assistant), and your own order.
  function closeMenu() { const el = document.querySelector('.menu'); if (el) el.remove(); }
  function openMenu(x, y, key) {
    closeMenu();
    const g = groupOf.get(key) || { keys: [key], pri: 0 };
    const isDone = g.done || doneHere.has(key) || (cur && cur.key === key && cur.ai && cur.ai.done);
    const many = g.keys.length > 1 ? ` (${g.keys.length} letters)` : '';
    const el = document.createElement('div');
    el.className = 'menu';
    el.innerHTML = `<button data-m="open">Open</button><hr>
      ${isDone ? '<button data-m="undone">Not done, bring it back</button>' : `<button data-m="done">Done${many}</button><button data-m="note">Done with a note…</button>`}
      <button data-m="later">Later: tomorrow morning</button><button data-m="laterwhen">Later…</button>
      <hr>${g.today ? '' : '<button data-m="important">Important: put it on Today</button>'}<button data-m="up">Move to the top</button><button data-m="down">Move to the end</button>
      ${g.pri ? '<button data-m="normal">Back to the assistant\'s order</button>' : ''}
      <hr><button data-m="wrong">Not important (done, and teach the assistant)…</button>`;
    document.body.appendChild(el);
    const r = el.getBoundingClientRect();
    el.style.left = Math.min(x, innerWidth - r.width - 8) + 'px';
    el.style.top = Math.min(y, innerHeight - r.height - 8) + 'px';
    el.onclick = (e) => {
      const b = e.target.closest('[data-m]'); if (!b) return;
      const a = b.dataset.m, item = today.find((t) => t.key === key) || items.find((t) => t.key === key);
      if (a === 'open') { closeMenu(); return openLetter(key); }
      if (a === 'done') { closeMenu(); return markDone(key, g.keys, g.today ? item : null); }
      if (a === 'undone') { closeMenu(); markUndone(key, g.keys); if (view.name === 'folder') askFolder(); return; }
      if (a === 'important') { closeMenu(); return markImportant(key, g.keys); }
      if (a === 'later') { closeMenu(); return markLater(key, g.keys, LATER[2][2]().getTime(), item); }
      if (a === 'laterwhen') { ui.laterFor = key; groupOf.set(key, g); el.innerHTML = `<div class="split" style="border:0">${laterMenu().replace('modes later', 'modes later inmenu')}</div>`; return; }
      if (a === 'up' || a === 'down' || a === 'normal') {
        closeMenu(); send({ type: 'pri', keys: g.keys, how: a });
        return toast(a === 'up' ? 'Moved to the top' : a === 'down' ? 'Moved to the end' : "Back in the assistant's order");
      }
      if (a === 'note' || a === 'wrong') {
        const wrong = a === 'wrong';
        el.innerHTML = `<div class="why"><small>${wrong ? 'Why does it not need you? The assistant reads this every time it sorts new letters.'
            : 'What happened, or what should the assistant learn? It reads your notes every time it sorts new letters.'}</small>
          <textarea id="mNote" placeholder="${wrong ? 'e.g. Calendar invitations never need me; I see them in the calendar' : 'e.g. Handled on the phone. Letters from this agency are only FYI'}"></textarea>
          <div class="go"><button class="btn" id="mSave">Done</button><button class="link" id="mNo">Cancel</button></div></div>`;
        const t = $('mNote'); t.focus();
        const save = () => {
          closeMenu();
          markDone(key, g.keys, g.today ? item : null, t.value.trim(), wrong ? 'not important: the owner did not need to see this' : 'done by the owner, nothing more to do');
        };
        $('mSave').onclick = save; $('mNo').onclick = closeMenu;
        t.addEventListener('keydown', (e) => { e.stopPropagation(); if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); save(); } if (e.key === 'Escape') closeMenu(); });
      }
    };
  }
  document.addEventListener('contextmenu', (e) => {
    const row = e.target.closest('[data-open]');
    const key = row ? row.dataset.open : view.name === 'letter' && cur && !cur.key.startsWith('outbox/') && !e.target.closest('textarea, input') ? cur.key : null;
    if (!key) return;
    e.preventDefault();
    if (!row && cur) groupOf.set(cur.key, { keys: convKeys(cur), pri: 0, done: !!(cur.ai && cur.ai.done), today: today.some((t) => t.key === cur.key) });
    openMenu(e.clientX, e.clientY, key);
  });
  document.addEventListener('mousedown', (e) => {
    if (!e.target.closest('.menu')) closeMenu();
    if (ui.polishMenu && !e.target.closest('.split')) { ui.polishMenu = false; if (comp) redrawComp(); }
    if (ui.laterMenu && !e.target.closest('.lsplit')) { ui.laterMenu = false; if (view.name === 'letter') drawLetter(); }
  });

  $('bSettings').onclick = () => view.name === 'settings' ? go({ name: 'home' }) : go({ name: 'settings' });
  $('bWrite').onclick = () => { if (!accts.length) return go({ name: 'add' }); toggleDrawer(false); if (comp) saveDraft(true); comp = null; go({ name: 'new' }); };
  $('bFind').onclick = () => hs.open && view.name === 'home' ? closeFind() : openFind();
  $('bRefresh').onclick = () => { send({ type: 'refresh' }); toast('Getting mail…'); };
  document.addEventListener('keydown', (e) => {
    const cmd = e.ctrlKey || e.metaKey, k = e.key.toLowerCase();
    if (cmd && k === 'n') { e.preventDefault(); return $('bWrite').click(); }
    if (cmd && k === 'r') { e.preventDefault(); return $('bRefresh').click(); }
    if (cmd && k === 'f') { e.preventDefault(); if (view.name === 'folder') return $('q') && $('q').focus(); return openFind(); }
    if (cmd && k === 'k') { e.preventDefault(); if (view.name !== 'home') go({ name: 'home' }); return $('cin') && $('cin').focus(); }
    if (cmd && (k === 'w' || k === 'q')) { e.preventDefault(); saveDraft(true); return setTimeout(() => send({ type: 'quit' }), 120); }
    const typing = ['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName);
    if (k === 'escape' && viewer) { viewer = null; return drawViewer(); }
    if (k === 'escape' && document.querySelector('.menu')) return closeMenu();
    if (k === 'escape' && hs.open && view.name === 'home' && !['INPUT', 'TEXTAREA'].includes(e.target.tagName)) return closeFind();
    if (k === 'escape') {
      if (typing) return e.target.blur();
      if (document.body.classList.contains('dopen')) return toggleDrawer(false);
      if (calmOpen) { calmOpen = false; drawBar(); return draw(); }
      if (view.name === 'letter') return back();
      if (view.name !== 'home') return go({ name: 'home' });
      return;
    }
    if (typing) return;
    if (view.name === 'folder' && (k === 'arrowdown' || k === 'j')) { e.preventDefault(); return move(1); }
    if (view.name === 'folder' && (k === 'arrowup' || k === 'k')) { e.preventDefault(); return move(-1); }
    if (view.name === 'folder' && k === 'enter' && sel >= 0) { const n = document.querySelector(`[data-n="${sel}"]`); return n && n.click(); }
    if (view.name === 'letter' && cur && k === 'r' && !cmd) { e.preventDefault(); return letterAct(e.shiftKey ? (replyMode(cur) === 'all' ? 'reply' : 'all') : 'answer'); }
    if (view.name === 'letter' && cur && !cmd && (k === 'j' || k === 'arrowright')) { e.preventDefault(); return step(1); }
    if (view.name === 'letter' && cur && !cmd && (k === 'k' || k === 'arrowleft')) { e.preventDefault(); return step(-1); }
    if (view.name === 'letter' && cur && (k === 'delete' || k === 'backspace')) return letterAct('trash');
  });
  draw();
</script>
</body></html>
